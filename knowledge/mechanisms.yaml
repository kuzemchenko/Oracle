    отсюда растянутое падение (post-event drift). Конкуренты получают опцион на переток клиентской базы при почти
    нулевых издержках.'
  trigger_class: 'Глобальный сбой по вине обновления вендора; взлом цепочки поставок ПО (supply-chain attack) с
