# ops/roadmap_state.yaml — машинное состояние дорожной карты «Оракул v3»
# ЕДИНСТВЕННЫЙ источник правды «какой этап, какой шаг, что блокирует».
# Канон карты: reports/review_2026-10-31/ДОРОЖНАЯ_КАРТА_v3.md
# Правила (инвариант процесса v3):
#   • каждая рабочая сессия: прочитать этот файл → сделать следующий шаг → пуш в master → обновить файл;
#   • одна сессия = один этап; параллельность только у явно независимых этапов;
#   • этап НЕ закрыт, пока результат не виден владельцу в Telegram (гейт обязан содержать
#     ссылку/дату реального пуша);
#   • шаг не продвинулся 2 цикла подряд → stuck_count растёт → при stuck_count>=2 машинист обязан
#     задать владельцу вопрос-развилку и записать его сюда в blocked_on;
#   • файл правится ТОЛЬКО вместе с реальным продвижением (не редактировать «для порядка»).

версия: 1
обновлено: "2026-10-31"
обновил: "облачная сессия 31.10 (большой разбор + карта v3)"

точка_Б:
  срок: "2027-02-01"
  критерии: "см. ДОРОЖНАЯ_КАРТА_v3.md §1 (зафиксированы 31.10, передоговаривать нельзя)"
точка_Б1:
  срок: "2026-11-28"

текущий_этап: V0
этапы:
  V0:
    название: "«Идея дня» в бой + честный ноль"
    статус: next            # next | in_progress | gate_review | done | stuck | frozen
    шаги:
      - "[ ] шаблон «Идея дня» в bot_reports поверх A1/Топ-3: событие→цепочка с отыгранностью→моё звено→строка «потенциал×шанс×срок»→кто продаёт нам→суд как за/против→счёт честности одной строкой"
      - "[ ] блокирующий линт подачи (≤4 числа, 0 тех.id, тикеры с именами) + тесты"
      - "[ ] «честный ноль» одной строкой вместо простыни"
      - "[ ] подача: убрать «Сила X/5» (r=0.038 к исходам — шум), печатать честную базу трека «сбывались в 48%» (серверное П-4 от 31.10)"
      - "[ ] фикс mathlib/cascade.py:209 (reliability/amplitude_sd в node_probability) + тест"
      - "[ ] фикс portfolio.py:174 (месячный риск не 0.0) + тест"
      - "[ ] stage-review + 5 боевых дней подряд через линт + подтверждение владельца «формат тот»"
    gate: "5 боевых утр подряд ровно 1 сообщение через линт; подтверждение владельца в боте"
    stuck_count: 0
    blocked_on: null
  V1:
    название: "Машина процесса (state, буксовка, алерт тишины GitHub)"
    статус: in_progress      # state-файл и машинист созданы 31.10; остальное — шаги
    шаги:
      - "[x] ops/roadmap_state.yaml создан (31.10)"
      - "[x] еженедельный машинист-сессия по пятницам создана (31.10, облако)"
      - "[x] вечерний чекпоинт-крон журналов (сервер, 31.10, ops/checkpoint.sh)"
      - "[ ] auto_review: алерт «пуш в GitHub старше 4 дней»"
      - "[ ] auto_review: алерт буксовки по stuck_count из этого файла"
    gate: "два автоцикла машиниста подряд; тест искусственной буксовки рождает вопрос владельцу"
    stuck_count: 0
    blocked_on: null
  V2:
    название: "Кнопки, петля владельца, очередь 135 тем, человеческие подписи §25"
    статус: queued
    gate: "кнопки в 5 боевых пушах; ≥1 реальное нажатие в decisions_user.jsonl; ≥1 пакет тем разобран"
    stuck_count: 0
    blocked_on: "Подпись-1 (показ≠деньги) — для полноты; кнопки и темы можно без неё"
  V3:
    название: "Режим «качаем 2 дня» (кнопка → устойчивость → экономика → паспорт идеи)"
    статус: queued
    gate: "≥1 идея прошла цикл вживую; расходы в costs.jsonl под потолками"
    stuck_count: 0
    blocked_on: null
  V4:
    название: "Живые проценты: монотонная рекалибровка вместо константы 46.7%"
    статус: queued
    gate: "walk-forward: спред ≥20 п.п., бины монотонны (кластерный бутстрэп); Подпись-2"
    stuck_count: 0
    blocked_on: "Подпись-2"
  V5:
    название: "«Шансы недели» + голос мудрого экономиста: событийный трек 3–13 недель"
    статус: queued
    шаги:
      - "[x] реестр тезисов владельца создан — knowledge/theses_owner.yaml (31.10: T1 потоки критических активов, T2 сдерживание Китая)"
      - "[ ] промпт агента «экономист потоков» (поверх fundamental_school + game_theory_school) + роль в models.yaml"
      - "[ ] тезис → следствия → §9-вопросы с машинным разрешением; печать в отдельный трек"
      - "[ ] пуш «Шансы недели» через линт; счёт форварда на каждом тезисе (владелец видит «этот взгляд сбывался в X%»)"
    gate: "2 недели крона, ≥16 запечатанных §9-вопросов, пуш ≥2 раза через линт; Подпись-3"
    stuck_count: 0
    blocked_on: "Подпись-3"
  V6:
    название: "Фабрика edge: рёбра нового класса (условные Д3, перебор мира Э4ж, горизонт недели+)"
    статус: queued
    gate: "≥40 рёбер нового класса с провенансом; месячный отчёт в бот"
    stuck_count: 0
    blocked_on: null
  V7:
    название: "Точки Б1 (28.11) и Б (01.02.2027): замер и вердикт владельца"
    статус: queued
    gate: "отчёт сверен независимым пересчётом; кнопка владельца; решение в журнале"
    stuck_count: 0
    blocked_on: null

