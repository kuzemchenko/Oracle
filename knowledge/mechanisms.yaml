# knowledge/mechanisms.yaml — БИБЛИОТЕКА ЭКОНОМИЧЕСКИХ МЕХАНИЗМОВ (ядро v3, этап V6)
#
# СТАТУС: СЕМЯ-ЧЕРНОВИК v2 — полные 8 доменов (собрано 01.11.2026 исследовательским воркфлоу: 8 доменов × ресерч
# с источниками + сводчик-критик; ~1М токенов, 127 обращений к источникам).
# П8/П16: механизм = причинное правило с историческими прецедентами и ссылками — это
# ГИПОТЕЗА-РАМКА, не прогноз. До боевого использования каждый механизм обязан пройти:
#   1) детерминированную валидацию прецедентов на данных (сервер, V6);
#   2) форвард-испытательный срок (§9-вопросы, запечатывание, свой счёт hit/N);
#   3) при счёте — допуск в «Идею дня»; владелец видит «этот механизм сбывался в X%».
# forward_score у всех = нулевой старт. Поле tradeable:false = механизм отыгрывается
# быстрее недель или без датированных прецедентов — хранится для полноты, в бой не идёт.
# Пополнение: экономист потоков (тезисы владельца) + историк прецедентов + дежурный;
# правки — только через git с ревью (конфиг не трогается рантаймом).
версия: 2
создано: '2026-11-01'
источник: workflow mechanisms-seed-library (8 доменов + сводчик), сессия 31.10-01.11
сводка_сводчика: 'СВОДКА БИБЛИОТЕКИ (сводчик-критик, 01.11.2026). ВХОД: заявлено 8 доменов, фактически получено
  6: energy (8), geopolitics (9), supply_chains (8), materials (9), agri (9), macro — ОБРЕЗАН (3 полных механизма
  + banking_stress_flight_to_quality без прецедентов; поиск полного сырья в репо по уникальным id дал ноль — текст
  существовал только в задании). Домены 7–8 не получены вовсе (судя по составу, вероятно tech/AI и кредит/FX) —
  это главные тонкие места покрытия; у macro нет fiscal/QT-механизмов, у библиотеки в целом нет крипто/FX-специфики.
  ДЕДУП: слито 5 кластеров, −8 позиций: energy_supply_shock (energy+geopolitics, 2→1), chokepoint_disruption (energy+geopolitics+supply_chains,
  3→1), sanctions_flow_rerouting (energy+geopolitics+supply_chains tonne-mile, 3→1), gas_ammonia_cascade (energy+geopolitics+agri,
  3→1), critical_materials_export_control (geopolitics+materials, 2→1); при слиянии прецеденты объединены (лучшие
  величины+URL из всех копий), условия и контрпримеры — union. infrastructure_quota_auction сознательно НЕ слит
  с chokepoint (разная природа: частичное/предсказуемое vs полное/внезапное — разные лаги); staple_export_ban НЕ
  слит с export_corridor_conflict (политический vs военный триггер, разная стойкость). ИТОГ: 47 видимых − 8 = 39
  механизмов, все id в snake_case. КАЧЕСТВО: tradeable:false у 2 — demand_boom_inelastic_supply_cycle (полный цикл
  26–100 недель, вне зоны 3–13; изломы торгуемы как фрагменты) и banking_stress_flight_to_quality (сырьё обрезано:
  0 прецедентов + ядро за дни). Условно-торгуемые (true с оговорками в conditions): port_labor_stoppage (большинство
  эпизодов — дни; сигнал только фактическая остановка >1 нед), tariff_substitution и reshoring_capex_boom (тренд
  квартально-годовой, в зоне охоты только анонсы), inflation_surprise (одиночный релиз — часы, торгуема серия),
  political_unrest_fade (торгуемая сторона — затухание страха, не тренд). РАНЖИРОВАНИЕ: первые ~28 — ядро (датированные
  прецеденты с величинами+URL, лаг звеньев в зоне 3–13 недель, машинно-опознаваемый триггер); хвост списка — медленные/условные/обрезанные.
  КЛЮЧЕВЫЕ МЕТА-ПРАВИЛА, повторившиеся независимо в 4+ доменах (кандидаты в жёсткие фильтры генератора V5/V6): (1)
  структурность шока — главный фильтр торгуемости: погодные/короткие/страховые шоки без физической потери объёмов
  (Uri, Ever Given, Абкайк, Сулеймани, ILA-2024) дают огромную амплитуду, но отыгрываются за дни; (2) шок предложения
  торгуем ТОЛЬКО при живом спросе (Шанхай-2022, алюминий авг-2022); (3) повторный триггер того же класса даёт затухающую
  амплитуду (зерновая сделка 2023, чип-санкции 2023-24, стимулы КНР ноя-дек 2024); (4) 1-е звено почти всегда отыграно
  за день — охота на 2–3-е звено, что совпадает с правилом V0 «ближайшее неотыгранное звено»; (5) у ограничительных
  механизмов ход двухфазный (спайк → закрепление ИЛИ полный разворот), датчик выбора ветки всегда физический (запасы,
  TC/RC, операционные заявления), не новостной; (6) готовые кандидаты в инверсию B1: feed_margin_livestock_cycle
  (ликвидация стада сначала ДЕШЕВИТ мясо), epizootic_protein_shock (АЧС роняет кормовой спрос на сою), refinery_capacity_shock
  (нефть ВНИЗ при росте крэков). П8-оговорки исследователей сохранены внутри полей (расхождения баз измерения, неподтверждённые
  детали помечены). ДОЛГ: перезапросить домены 7–8 и полный macro, затем доращить библиотеку (сейчас 39/60).'
механизмы:
- id: energy_supply_shock
  rule: 'Крупный конфликт/эмбарго, физически выбивающий заметную долю (>2–3%) предложения нефти/газа у экспортёра
    топ-10, поднимает энергию на недели-месяцы; 2-й ход: маржа энергоёмких отраслей вниз, замещающие поставщики
    (СПГ США, нейтральные добытчики) вверх; 3-й ход: удобрения/продовольствие вверх, давление на импортёров энергии.'
  theory: 'Шок предложения при низкой краткосрочной эластичности спроса: малое выпадение объёма даёт непропорциональный
    рост цены к издержкам замыкающего поставщика; далее cost pass-through по цепочке и эффект замещения (рента перетекает
    к незатронутым производителям).'
  trigger_class: война/вторжение/эмбарго/крупная авария у экспортёра энергии топ-10 с ФАКТИЧЕСКОЙ потерей объёмов
    (не только риторика)
  chain:
  - '1) выпадение предложения → нефть/газ спот и ближние фьючерсы ↑ (сильнее региональный бенчмарк: TTF при газовом
    шоке)'
  - 2) маржа энергоёмких (химия, металлургия, авиа) ↓; замещающие поставщики вне зоны конфликта ↑; нефтесервис/E&P
    ↑
  - 3) удобрения ↑ → продовольствие ↑; валюты/акции импортёров энергии ↓
  conditions:
  - 'СРАБАТЫВАЕТ: объём реально уходит с рынка надолго (недели+), свободные мощности ОПЕК+ и запасы/резервы низкие'
  - 'НЕ СРАБАТЫВАЕТ: быстрый ремонт/большие свободные мощности (Абкайк-2019 — откат за 2 недели), скоординированный
    выпуск резервов, шок уже в цене после долгой эскалации'
  - величину хода масштабировать долей выпавшего предложения от мирового
  lag_weeks: 1-й ход 0–4 (пик 2–8); 2-й ход 2–12; 3-й ход 8–26
  precedents:
  - year: '1973'
    event: эмбарго ОАПЕК после войны Судного дня
    observed: нефть ~$3 → ~$12/б ступенями за 3–5 месяцев, ~+300%
    source: https://en.wikipedia.org/wiki/1973_oil_crisis
  - year: '1990'
    event: Ирак вторгся в Кувейт (02.08), эмбарго ООН вырезало >4 млн б/д
    observed: спот ~$21 (конец июля) → пик $40–46 к середине октября (~10 недель); откат после начала «Бури в пустыне»
    source: https://www.econlib.org/archives/2014/06/who_caused_the.html
  - year: '1979'
    event: Иранская революция, затем ирано-иракская война
    observed: нефть более чем удвоилась с апр.1979 по апр.1980
    source: https://www.atfx.com/en/analysis/trading-strategies/5-major-oil-crisis-that-changed-the-world
  - year: '2022'
    event: вторжение РФ в Украину 24.02, обрезание газа Европе
    observed: TTF +~35% в день 1 (€120/МВт·ч), >€200 к началу марта; пик €319.98 26.08.2022; Brent >$105 в день
      1, ~$129 к началу марта
    source: https://www.spglobal.com/energy/en/news-research/latest-news/natural-gas/022422-europes-ttf-gas-price-surges-by-28-as-russia-launches-ukraine-invasion
  watch_assets: фьючерс-прокси нефти/газа (Brent/WTI, TTF, Henry Hub; USO/BNO/UNG), энергосектор (XLE/XOP), СПГ-экспортёры
    как класс, химия/удобрения как 2–3-й ход, авиаперевозчики (обратная нога), валюты импортёров энергии
  tradeable: true
  amplitude: '1-й ход: нефть +30–130% за 2–10 недель; газ региональный кратно (TTF ×2–3 за недели)'
  counterexamples: 'Абкайк 14.09.2019: выпало 5.7 млн б/д (~5% мира), +14% за день, но добыча восстановлена к 30.09
    — премия сжалась до ~$1–1.6/б за 2 недели (https://www.everycrsreport.com/reports/IN11173.html); Сулеймани 01.2020:
    +3–4% и разворот за ~2 дня (инфраструктура не задета). Фильтр: подтверждённая потеря объёмов, а не страх.'
  forward_score:
    вопросов: 0
    исходов: 0
    попаданий: 0
- id: chokepoint_disruption
  rule: 'Устойчивая (недели+) угроза судоходству в чокпойнте (Суэц/Баб-эль-Мандеб, Ормуз, Босфор) не столько двигает
    сырьё, сколько удлиняет маршруты: обход изымает эффективную провозную ёмкость флота → фрахт и страховые премии
    кратно вверх; выигрывают судовладельцы (тонно-мили), проигрывают грузовладельцы со спотовой логистикой.'
  theory: 'Неэластичное предложение тоннажа в краткосроке: обход мыса Доброй Надежды добавляет 7–20 дней рейса =
    изъятие мощности при том же спросе → цена фрахта к издержкам замыкающего судна + военная страховая премия. Сырьё
    реагирует слабо, пока объёмы едут дольше, а не исчезают.'
  trigger_class: атаки на суда / блокировка / военная угроза в проливе или канале; официальные объявления крупных
    перевозчиков об обходе ('suspend transit', 'reroute'); резкий рост war-risk премий
  chain:
  - '1) объявления об обходе → транзит через чокпойнт ↓ (Красное море 2024: −80%) → спотовый фрахт затронутых маршрутов
    ↑ кратно'
  - 2) акции контейнерных линий и танкерных компаний ↑; страховщики повышают премии
  - '3) 8–16 нед: издержки импортёров с длинным плечом (ритейл/автопром Европы) ↑ → давление на маржу, инфляционный
    импульс'
  conditions:
  - 'СРАБАТЫВАЕТ: угроза длится недели+, обход объявлен крупнейшими линиями, флот близок к полной занятости, доля
    узла велика (Суэц ~12–19% контейнерного трафика)'
  - 'НЕ СРАБАТЫВАЕТ: короткая блокировка (дни) при свободном флоте; избыток тоннажа (рекордный orderbook 2024–25
    постепенно съел премию Красного моря)'
  - 'Ормуз — особый случай: обхода нет, механизм перетекает в energy_supply_shock; эффект на нефть при коротких
    блокировках — дни, неторгуем'
  lag_weeks: фрахт 1–4 до пика; акции перевозчиков 2–8; перенос в издержки импортёров 8–16
  precedents:
  - year: 2023-2024
    event: атаки хуситов в Красном море, массовый обход Суэца с конца декабря
    observed: Drewry Шанхай→Роттердам $1667 (21.12.23) → $4406 (11.01.24), +164% за 3 недели; SCFI Шанхай–Европа
      $1029→$2694/TEU за 2 недели (~2.6x); SCFI +40% за одну неделю; трафик Красного моря −80%
    source: https://gep.com/blog/mind/red-sea-crisis-how-rerouting-is-impacting-shipping-costs ; https://www.lloydslist.com/LL1147713/Asia-Europe-boxship-freight-rates-more-than-double-after-Houthi-attacks
  - year: '2021'
    event: Ever Given перекрыл Суэц на 6 дней, 400+ судов в очереди
    observed: контейнерный спот +10% за ~2 недели; ставки продуктовых танкеров почти удвоились за дни; нефть +~4%
      с полным откатом за неделю — контрпример короткой блокировки
    source: https://www.tbsnews.net/node/222490 ; https://www.spglobal.com/energy/en/news-research/latest-news/shipping/032521-container-lines-warn-of-further-delays-at-suez-publish-waiting-lists-amid-record-freight-rates
  - year: '2019'
    event: атаки на танкеры в Оманском заливе у Ормуза
    observed: рост war-risk премий и танкерных ставок на каждом инциденте с откатом при паузах — транзит не прерывался,
      эффект меньше контейнерного кейса
    source: https://www.rivieramm.com/news-content-hub/tanker-market-braced-for-aftermath-of-drone-attack-on-saudi-arabian-oil-installation-56195
  watch_assets: фрахтовые индексы (Drewry WCI, SCFI, Freightos FBX, Baltic Dirty/Clean Tanker) как датчики 1-го
    звена; акции контейнерных линий (Maersk, Hapag-Lloyd, ZIM) и танкерных компаний; war-risk премии; 3-е звено
    — европейский импорт-ритейл (короткая нога)
  tradeable: true
  amplitude: контейнерные ставки +100–170% (до ×2.6) за 2–4 недели; танкерные ×2; акции перевозчиков +20–60% за
    месяц горячей фазы; сырьё — единицы %
  counterexamples: 'Ever Given 2021: 6 дней — для сырья и устойчивого фрахта торговать было нечего. 2024–25: рекордный
    ввод новых контейнеровозов съел премию задолго до деэскалации — при избытке флота механизм затухает. При снятии
    угрозы ставки падают так же быстро, как росли (первый откат Красного моря через ~6 недель).'
  forward_score:
    вопросов: 0
    исходов: 0
    попаданий: 0
- id: sanctions_flow_rerouting
  rule: 'Санкции/эмбарго/ценовой потолок против крупного экспортёра нефти редко убирают объём — они перестраивают
    потоки: подсанкционный сорт уходит в дисконт (главный измеримый след), тонно-мили и фрахт растут (маршруты длиннее,
    комплаенс-флот сегментируется), замещающие поставщики захватывают премиальный рынок; бенчмарк растёт умеренно.'
  theory: 'Трение в торговле + сегментация рынка: дисконт = цена юридического/логистического риска обхода; спрос
    на суда = объём × расстояние (Балтика→Индия = ×5 плеча против Балтика→Роттердам); рента достаётся логистике,
    арбитражёрам и НПЗ-покупателям скидочного сырья.'
  trigger_class: санкционные пакеты/эмбарго/прайс-кэп на нефтяной экспорт; SDN-листинг танкеров и трейдеров; самосанкционирование
    покупателей
  chain:
  - 1) пакет → дисконт подсанкционного сорта к Brent расширяется (недели); бенчмарк умеренно ↑
  - 2) тонно-мили ↑ → ставки танкеров и несанкционные операторы ↑; замещающие поставщики премиального рынка ↑ (СПГ
    США → Европа, ближневосточный дизель)
  - 3) НПЗ-покупатели скидочного сырья (Индия, Китай, Турция) — маржа ↑; бюджет/валюта подсанкционной страны ↓ с
    лагом
  conditions:
  - 'СРАБАТЫВАЕТ: реальный enforcement (вторичные санкции на покупателей/суда), широкий круг присоединившихся, дефицит
    несанкционного тоннажа, низкий orderbook'
  - 'ЗАТУХАЕТ: теневой флот/обходные схемы обкатываются — дисконт сжимается за 2–4 квартала (Urals $30+ в 2022 →
    ~$10-е к 2023-24); новое ужесточение снова расширяет'
  - 'дисконт — метрика эффективности санкций и датчик различения с energy_supply_shock: объём исчез (бенчмарк) или
    поехал дальше (дифференциал)'
  lag_weeks: дисконт 1–6 после пакета; фрахт 2–8; перестройка потоков и 2-е ходы 4–13+; вход лучше между объявлением
    и вступлением эмбарго
  precedents:
  - year: '2022'
    event: 'санкции на РФ: дисконт Urals и фрахт'
    observed: Urals−Brent с $2–10/б до $29–36/б за 4–5 недель (18.03–27.05.2022), low-$20s с осени; Aframax Чёрное
      море $10.11/т (янв) → $32.10/т (апр), ×3 за ~10 недель; BDTI +243% за 12 мес к ноябрю 2022
    source: https://www.spglobal.com/commodity-insights/en/news-research/latest-news/crude-oil/032222-russian-urals-crude-falls-93-centsb-on-day-to-record-low-discount-to-dated-brent
      ; https://www.eia.gov/todayinenergy/detail.php?id=52498
  - year: '2022'
    event: отказ Европы от российского дизеля (~50% её импорта)
    observed: европейские дизельные крэки — рекорд ~$60/б в марте и >$80/б в октябре 2022; маржа переработки США
