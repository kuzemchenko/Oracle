- id: memory_supply_cut_cycle_turn
  rule: 'Лидер олигополии памяти (Samsung) публично объявляет сокращение производства DRAM/NAND после периода убытков
    → это маркер дна цикла: акции ВСЕЙ тройки производителей памяти растут с дня объявления, контрактные цены памяти
    разворачиваются вверх через 1–2 квартала.'
  theory: 'Олигополия с 3 игроками (Samsung/SK Hynix/Micron ~95% DRAM): предложение концентрировано, спрос на память
    неэластичен в краткосроке. Пока лидер держит объёмы, цены падают до cash cost; его капитуляция (сокращение выпуска)
    — координирующий сигнал, после которого избыток запасов рассасывается и ценовая власть возвращается. Рынок акций
    отыгрывает разворот раньше самих цен.'
  trigger_class: Официальное заявление производителя памяти топ-3 о сокращении выпуска/капекса (production cut,
    meaningful level, capex cut) на фоне обвала прибыли сектора
  chain:
  - 1) Объявление сокращения → акции объявившего ↑ и акции КОНКУРЕНТОВ ↑ в тот же день (сигнал дисциплины предложения)
  - 2) Через 4–13 недель → запасы у покупателей исчерпываются, спотовые, затем контрактные цены памяти перестают
    падать и разворачиваются
  - 3) Через 1–3 квартала → маржа всей тройки восстанавливается, акции сектора памяти опережают полупроводниковый
    индекс
  conditions:
  - Срабатывает, только когда режет ЛИДЕР (Samsung); сокращения №2–3 (Micron/Hynix резали ещё в 2022) дна не делают
