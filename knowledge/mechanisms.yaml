  - Нужен видимый пик запасов у клиентов; при растущем спросовом шоке (ИИ/HBM) разворот быстрее и сильнее
  - НЕ срабатывает, если сокращение уже полностью ожидалось или слишком мало относительно избытка
  - Акции часто начинают расти ДО объявления (рынок торгует «скоро капитулирует») — вход на самом объявлении ловит
    только часть хода
  lag_weeks: 0–2 недели первая реакция акций; 4–26 недель до разворота контрактных цен — ядро хода внутри зоны 3–13
