# config/presentation.yaml — СЛОЙ ПОДАЧИ отчёта §8 в Telegram (только отображение).
# НЕ влияет на данные/журналы/честность (CLAUDE.md): journal/funnel_logs и predictions.jsonl
# пишутся полностью независимо. Здесь — только то, КАК текст показывается человеку.
# Правится руками ИЛИ командой бота /format (см. ops/bot.py).

version: 1

# Режим многословности карточки идеи:
#   long  — ℹ️-пояснения показаны у ВСЕХ 13 полей (по умолчанию, пока пользователь привыкает);
#   short — ℹ️ показаны ТОЛЬКО для полей из still_unclear; содержание (→) остаётся всегда.
mode: long

# В режиме short — номера полей §8 (1..13), у которых всё ещё показывать ℹ️ («ещё мутно»).
still_unclear: []

# Слать ли проверочные (mock/test) прогоны в Telegram. По умолчанию НЕТ — чтобы не путать с
# идеями. Если true — приходят с явной шапкой «🔧 Проверка связи — это НЕ идея».
send_mock_to_telegram: false

# Этап3 (пакет после аудита): «Разбор дня» — читаемый текст без эмодзи, с секциями «что это значит
# для тебя» и «что делать» (STYLE_CONTRACT). Оставлен как ФОЛБЭК-лид (если Топ-3 не собрался).
daily_case_lead: true

# Flow-fix В1 (решение владельца 15.07): ГЛАВНЫЙ дневной пуш = «Топ-3 одной строкой» + защита №1.
# Владелец забраковал длинный «Разбор дня» как сложный и бесполезный и выбрал этот формат: три
# сильнейшие идеи по строке, ранжированные по баллу силы исследовательского разбора (поле разбор_идей),
# приглашение «скажи номер». Без эмодзи, стиль Forbes; линтер стиль-контракта fail-closed (сломан
# шаблон → откат на «Разбор дня», затем на дайджест — пуш не теряется). Приоритетнее daily_case_lead.
top3_lead: true

# V0 «Идея дня» (дорожная карта v3, 31.10.2026; формат, согласованный владельцем 15.07): ОДНА идея,
# которую система защищает — событие → цепочка с отыгранностью звеньев → «моё звено» → «потенциал × шанс
# × срок ≈ матожидание» → кто продаёт нам → суд за/против → счёт честности. ≤4 числа, 0 тех.id,
# тикеры с именами (блокирующий линт). Приоритетнее top3_lead. НЕ прошёл линт → фолбэк на Топ-3 (тоже
# через линт) + заметка в дозор (stage-review V0). Остальные идеи — по запросу «что ещё было».
idea_day_lead: true

# V5 «Шансы недели» (карта v3): пуш пятничного выпуска §9-вопросов экономиста потоков.
# ПРАВИЛО ВНЕДРЕНИЯ (владелец, 01.11): false до ручного прогона испытателя и «ок» владельца.
week_odds_push: false

# 02.11 (вердикт владельца: «в Телеграме ничего не понимаю» = формат НЕ тот): редактор-рассказчик —
# строгий текст «Идеи дня» переписывается LLM-редактором в человеческий рассказ; числа/тикеры/рамка
# гардятся КОДОМ (ops/story_editor.verify), отказ → уходит строгий формат + заметка в дозор.
# ПРАВИЛО ВНЕДРЕНИЯ: false до ручного прогона испытателя и «ок» владельца.
story_editor: false

# Мост идей ОХОТНИКА (облачная охота → reports/ideas/*.push.txt → git pull 12:05 → бот → Telegram).
# Контент гейтится КОДОМ (presentation_lint.lint_hunter_idea): правила «Идеи дня» + рамка
# «не рекомендация» + запрет вероятностных слов даже прописью (Инв#6/П16 — вероятность печатается
# только из расчёта по запечатанному треку, у охотника печати §9 пока нет → только наблюдения).
# true — по прямому требованию владельца 02.11 («идея MP так и не попала в Telegram»);
# выключается здесь без кода.
hunter_push: true

# Архитектура охоты 02.11 (вердикт владельца: «даёшь идею — и тут же её убиваешь; каждый день нужна
# классная идея, а не «сегодня защищать нечего»»): утренняя «Идея дня» серверного конвейера в жанре
# «наблюдение» главным пушем НЕ уходит — идея дня приходит от охотника (с печатью в журнал и кнопками).
# Жанр «Идея дня» (защищаемая) от сервера уходит как раньше; конвейер — по запросу «что ещё было».
# Вернуть прежнее поведение: true.
server_observation_push: false

# Аудит 03.11 (P1 №24): задачи, которые бот запускает САМ (ops/bot.py SCHEDULED_JOBS) — «ок» владельца =
# облачный коммит флага, без захода в терминал ради crontab. Одноимённые строки crontab держать
# закомментированными (иначе двойной прогон). ПРАВИЛО ВНЕДРЕНИЯ: включать только после ручного показа и «ок».
deep_dive_auto: true      # «Качаем 2 дня» — ежедневно после 09:40 UTC; «ок» владельца 09.11 (после исправления: РАЗБИТА → без плана)
week_odds_auto: false     # «Шансы недели» с печатью — вт и чт после 08:10 UTC (пуш — флаг week_odds_push)
point_b_auto: false       # замер точки Б → reports/point_b/ — пятница после 17:30 UTC (уедет чекпоинтом)
price_snapshot_auto: true # снимок закрытий EODHD → reports/prices/closes_latest.json — ежедневно после 21:30 UTC
attention_watch_auto: true  # Q-тренды 09.11: датчик внимания толпы (просмотры Википедии) → reports/attention/ — ежедневно после 20:30 UTC (мандат владельца «запускай»; без LLM, владельцу не шлёт)
attention_fast_auto: true   # Q-тренды-быстро 09.11: каждые 15 мин — новости GDELT, почасовая Википедия, объём торгов → reports/attention/fast*
event_menu_auto: true    # меню событий (GDELT-файлы + Википедия + NewsAPI.ai) → reports/events/menu_latest.{json,md} — ежедневно после 21:00 UTC (решение владельца 04.11)
                          # (до чекпоинта 22:00; охотник в 03:17 берёт цены отсюда — из облака сайты котировок закрыты)

# 03.11 (решение владельца): охота за идеей — ТОЛЬКО по его запросу (задача 03:17/10:17 выключена).
# false = ежедневного сторожа «идея дня пока не готова» нет; честный ноль по запросу уходит как обычно.
daily_hunt: false
