# knowledge/long_themes.yaml — ПОЛКА ДЛИННЫХ ТЕМ (Q-полка-длинных-тем, автопилот владельца 15.11; ревью 14.11: Fable п.3 —
# «5–10 тем на 6–24 месяца типа литографии: владелец узкого места, вход на просадках, квартальная проверка тезиса»).
# Читает ops/long_shelf.py. Тезис темы — ГИПОТЕЗА (П8: не истина из-за авторитета; прогнозную силу зарабатывает форвардом),
# привязана к тезисам владельца knowledge/theses_owner.yaml (T1 — потоки критических активов, T2 — сдерживание Китая).
# Код ничего не добавляет к тезису: он раз в неделю считает по каждой бумаге просадку от годового максимума, оценку
# против собственной истории (P/E, P/S за 5 лет), пересмотр прогнозов аналитиков за 90 дней и дату следующего отчёта,
# и по правилам mathlib/shelf_rules ставит статус: зона входа / ждать / дорого / тезис под вопросом.
версия: 1
создано: 2026-11-15
правила:
  просадка_входа_проц: 20        # от максимума за 52 недели — «вход на просадке»
  дорого_перцентиль: 0.9         # P/E (или P/S, если прибыли нет) выше, чем в 90% кварталов своей истории за 5 лет
  пересмотр_тревога: -0.10       # прогноз прибыли на следующий год срезан аналитиками на 10%+ за 90 дней
  пересмотр_норма: -0.05         # для «зоны входа» прогнозы не должны резать сильнее 5%

темы:
  - id: compute_lithography
    название: "спрос на вычисления → оборудование для выпуска чипов"
    тезис_владельца: T1
    тезис: "Пока гиганты наращивают вложения в дата-центры для ИИ, заводам чипов нужно больше оборудования. У части оборудования почти нет замены — его выпускают одна-две компании в мире."
    узкое_место: "машины для печати самых мелких схем на кремнии и для контроля брака"
    бумаги:
      - {бумага: ASML.US, имя: "ASML", роль: "единственный в мире производитель машин EUV-литографии для самых передовых чипов", источник: "https://en.wikipedia.org/wiki/ASML_Holding"}
      - {бумага: KLAC.US, имя: "KLA", роль: "лидер оборудования для контроля брака на кремниевых пластинах", источник: "https://en.wikipedia.org/wiki/KLA_Corporation"}
      - {бумага: LRCX.US, имя: "Lam Research", роль: "оборудование для травления и нанесения слоёв на пластины", источник: "https://en.wikipedia.org/wiki/Lam_Research"}
    что_подтвердит: ["аналитики повышают прогнозы прибыли на следующий год", "гиганты в отчётах сохраняют или поднимают планы вложений в дата-центры"]
    что_опровергнет: ["гиганты урезают планы вложений в дата-центры", "новые ограничения на поставки оборудования в Китай без замены спроса в других странах"]

  - id: ai_power
    название: "электричество для дата-центров"
    тезис_владельца: T1
    тезис: "Дата-центрам для ИИ нужно много постоянного электричества, а новые станции и сети строятся годами. Выигрывают владельцы готовых станций и производители оборудования для них."
    узкое_место: "готовые станции, особенно атомные, и турбины с трансформаторами"
    бумаги:
      - {бумага: CEG.US, имя: "Constellation Energy", роль: "крупнейший в США оператор атомных станций", источник: "https://en.wikipedia.org/wiki/Constellation_Energy"}
      - {бумага: VST.US, имя: "Vistra", роль: "владелец атомных и газовых станций, продаёт электричество по рыночной цене", источник: "https://en.wikipedia.org/wiki/Vistra_Corp"}
      - {бумага: GEV.US, имя: "GE Vernova", роль: "производитель газовых турбин и оборудования для электросетей", источник: "https://en.wikipedia.org/wiki/GE_Vernova"}
    что_подтвердит: ["новые долгие договоры дата-центров на электричество", "растут цены на мощность на аукционах энергосистем"]
    что_опровергнет: ["ИИ становится резко экономнее по электричеству и планы дата-центров пересматривают вниз", "регулятор ограничивает подключение дата-центров к станциям"]

  - id: ex_china_materials
    название: "критические материалы вне Китая"
    тезис_владельца: T2
    тезис: "Китай — главный поставщик редких земель и магнитов и использует это в торговых спорах. США и союзники платят за поставщиков вне Китая, в том числе гарантиями цены."
    узкое_место: "добыча и разделение редких земель и выпуск магнитов вне Китая"
    бумаги:
      - {бумага: MP.US, имя: "MP Materials", роль: "единственный в США добытчик редких земель и производитель магнитов", источник: "https://en.wikipedia.org/wiki/MP_Materials"}
      - {бумага: REMX.US, имя: "VanEck Rare Earth and Strategic Metals ETF", роль: "фонд акций добытчиков редких и стратегических металлов", источник: "https://www.vaneck.com/us/en/investments/rare-earth-strategic-metals-etf-remx/"}
    что_подтвердит: ["новые государственные контракты и гарантии цены для поставщиков вне Китая", "Китай снова ужесточает вывоз"]
    что_опровергнет: ["долгое торговое перемирие с Китаем и снятие ограничений", "цены на редкие земли падают из-за избытка предложения"]

  - id: nuclear_fuel
    название: "атомное топливо"
    тезис_владельца: T1
    тезис: "Атомные станции продлевают и строят заново, а обогащение урана во многом было в России. Поставщики топлива вне России в выигрыше."
    узкое_место: "добыча урана и его обогащение вне России"
    бумаги:
      - {бумага: CCJ.US, имя: "Cameco", роль: "один из крупнейших в мире добытчиков урана", источник: "https://en.wikipedia.org/wiki/Cameco"}
      - {бумага: LEU.US, имя: "Centrus Energy", роль: "поставщик обогащённого урана в США", источник: "https://en.wikipedia.org/wiki/Centrus_Energy"}
    что_подтвердит: ["новые договоры на поставку топлива и на строительство реакторов", "ограничения на российский уран продлевают"]
    что_опровергнет: ["планы новых реакторов откладывают", "поставки российского обогащённого урана снова разрешают без ограничений"]

  - id: europe_rearm
    название: "перевооружение Европы"
    тезис_владельца: T1
    тезис: "Европа на годы вперёд увеличивает военные бюджеты, а заводы оборонки расширяются медленно — заказы опережают выпуск."
    узкое_место: "мощности европейских оборонных заводов"
    бумаги:
      - {бумага: EUAD.US, имя: "Select STOXX Europe Aerospace & Defense ETF", роль: "фонд акций европейской оборонки", источник: "https://www.selectetf.com/euad"}
    что_подтвердит: ["утверждены многолетние оборонные бюджеты", "растут портфели заказов у оборонных компаний"]
    что_опровергнет: ["мирное соглашение снимает срочность", "бюджеты переносят или урезают"]

  - id: us_lng
    название: "экспорт сжиженного газа из США"
    тезис_владельца: T1
    тезис: "Европа и Азия ищут газ не из России и не с Ближнего Востока; у США газ дешёвый, и экспортные заводы законтрактованы надолго."
    узкое_место: "экспортные заводы сжижения газа"
    бумаги:
      - {бумага: LNG.US, имя: "Cheniere Energy", роль: "крупнейший экспортёр сжиженного газа из США", источник: "https://en.wikipedia.org/wiki/Cheniere_Energy"}
    что_подтвердит: ["новые долгие договоры покупателей из Европы и Азии", "перебои газа с Ближнего Востока или из России"]
    что_опровергнет: ["избыток сжиженного газа в мире и падение цен", "запрет или пауза на новые экспортные разрешения в США"]

  - id: grid_buildout
    название: "стройка электросетей и возврат производств в США"
    тезис_владельца: T2
    тезис: "Новые заводы в США и дата-центры требуют сетей, подстанций и электрооборудования, которые сейчас в дефиците."
    узкое_место: "электрооборудование и подрядчики, строящие сети"
    бумаги:
      - {бумага: ETN.US, имя: "Eaton", роль: "производитель электрооборудования для зданий, заводов и дата-центров", источник: "https://en.wikipedia.org/wiki/Eaton_Corporation"}
      - {бумага: PWR.US, имя: "Quanta Services", роль: "крупнейший в США подрядчик по строительству электросетей", источник: "https://en.wikipedia.org/wiki/Quanta_Services"}
    что_подтвердит: ["растут портфели заказов", "энергокомпании повышают планы вложений в сети"]
    что_опровергнет: ["отмена льгот на строительство заводов", "энергокомпании урезают вложения"]
