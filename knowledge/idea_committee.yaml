# knowledge/idea_committee.yaml — ЛИСТ «ИНВЕСТИЦИОННОГО КОМИТЕТА»: финальный вердикт по идее (Q-вердикт-комитет).
#
# Владелец 22.11 (голосом): «идей ворох, не вижу, какая заслуживает внимания и на какую можно сделать ставочку»;
# «оценка не на ощущениях LLM, а на практиках инвесткомпаний». «Да, строй» — на лист из 10 проверок и три решения.
#
# ЧТО ЭТО: после проработки идея получает ОДНУ оценку «X из 10» и одно из трёх решений. Балл ставит КОД
# (mathlib/idea_score.py, Инв#6): пункт зачтён, только если в карточке/гипотезе есть факт со ссылкой или число,
# посчитанное кодом. «Не измерено» = не зачтено (П8). Модель собирает доказательства, но балл не ставит.
# ЧЕМ ЭТО НЕ ЯВЛЯЕТСЯ: балл — не вероятность роста. 8 из 10 = «ставка хорошо устроена и доводы проверены».
# Зарабатывают ли идеи с 8+ чаще остальных — покажет счёт по группам балла (ops/idea_verdict.py track).
#
# Источник проверок — те же правила, что уже считает код (knowledge/idea_rules.yaml: пометки), плюс сектор и суд.
# Новых слоёв проверки нет: это итоговая строка и правило решения поверх существующих пометок.
# Состав пунктов и пороги меняются ТОЛЬКО со словом владельца.
версия: 1
подпись: "владелец 22.11.2026: «Да, строй» (лист из 10 проверок; решения 8–10 / 6–7 / ≤5)"

решения:
  ставка: 8        # балл ≥ 8 и нет брака → «кандидат на маленькую ставку» (с листом ставки)
  ожидание: 6      # балл 6–7 (или ≥8 при браке) → «лист ожидания» с условием, что должно случиться
                   # ниже → «архив» с причиной в одну строку

пороги:
  асимметрия: 2.0          # п.8: возможный выигрыш / возможная потеря от входа. ЖДЁТ ПОДТВЕРЖДЕНИЯ ВЛАДЕЛЬЦА:
                           # шлагбаум (idea_gate) ставит пометку ниже 1.5; для «ставки» взято 2.0 (практика фондов 2–3 к 1)
  why_min_chars: 40        # п.5: объяснение «почему рынок пропускает» не короче
  reason_min_chars: 20     # п.3, п.9: основание не короче

пункты:
  - {id: 1, код: КАНАЛ,     группа: "История верна",        словами: "связь события с деньгами компании подтверждена фактом",
     не_зачтён: "связь от события до денег компании держится на неподтверждённом звене"}
  - {id: 2, код: РАЗМЕР,    группа: "История верна",        словами: "эффект заметен для прибыли компании",
     не_зачтён: "не посчитано, насколько эффект заметен для прибыли компании (или он мал)"}
  - {id: 3, код: СРОК,      группа: "История верна",        словами: "есть причина, почему эффект продержится",
     не_зачтён: "не показано фактом, почему эффект продержится"}
  - {id: 4, код: РЫНОК,     группа: "Мы видим то, чего не видит рынок", словами: "числом показано, чего рынок уже ждёт и чем мы отличаемся",
     не_зачтён: "не показано числом, чего рынок уже ждёт и чем отличается наш сценарий"}
  - {id: 5, код: ПОЧЕМУ,    группа: "Мы видим то, чего не видит рынок", словами: "названа причина, почему рынок это пропускает",
     не_зачтён: "не названа проверяемая причина, почему рынок это пропускает"}
  - {id: 6, код: ПРЕЦЕДЕНТ, группа: "Взгляд со стороны",     словами: "похожий случай в прошлом подтверждён числом и ссылкой",
     не_зачтён: "похожий случай из прошлого не подтверждён числом и ссылкой"}
  - {id: 7, код: СЕКТОР,    группа: "Взгляд со стороны",     словами: "сектор не против нас",
     не_зачтён: "сектор против нас или его состояние не измерено"}
  - {id: 8, код: ВЫИГРЫШ,   группа: "Устройство ставки",     словами: "возможный выигрыш заметно больше возможной потери",
     не_зачтён: "возможный выигрыш не превышает возможную потерю хотя бы вдвое"}
  - {id: 9, код: СОБЫТИЕ,   группа: "Устройство ставки",     словами: "есть событие с датой и цель, посчитанная расчётом",
     не_зачтён: "нет события с датой или цель цены не подкреплена расчётом"}
  - {id: 10, код: СУД,      группа: "Устройство ставки",     словами: "модель другого разработчика не нашла возражения без ответа",
     не_зачтён: "независимой проверки другой моделью не было или осталось возражение без ответа"}

# П.7 — состояние сектора считает код по ценам секторного фонда (mathlib/sector_rules.py, ops/sector_view.py).
сектор:
  дней_средней: 200          # долгая средняя цена фонда
  дней_импульса: 63          # ~3 месяца торгов
  дней_максимума: 252        # ~год торгов
  перегрев_над_средней: 0.15 # фонд выше своей 200-дневной средней на 15%+ …
  перегрев_от_максимума: -0.03   # … и не дальше 3% от годового максимума → «перегрет»
  # корректируется: ниже 200-дневной средней И за 3 месяца в минусе
  # попутный: выше 200-дневной средней И за 3 месяца не хуже широкого рынка (SPY)
  # иначе: нейтральный
  против_покупки: ["корректируется", "перегрет"]     # при идее «вверх» пункт 7 не зачтён
  против_продажи: ["попутный"]                       # при идее «вниз» пункт 7 не зачтён
  рынок: SPY.US
  фонды:        # сектор по классификации EODHD (General.GicSector / Sector) → биржевой фонд сектора
    "Information Technology": {фонд: XLK.US, имя: "технологии"}
    "Technology": {фонд: XLK.US, имя: "технологии"}
    "Energy": {фонд: XLE.US, имя: "нефть и газ"}
    "Financials": {фонд: XLF.US, имя: "финансы"}
    "Financial Services": {фонд: XLF.US, имя: "финансы"}
    "Health Care": {фонд: XLV.US, имя: "здравоохранение"}
    "Healthcare": {фонд: XLV.US, имя: "здравоохранение"}
    "Industrials": {фонд: XLI.US, имя: "промышленность"}
    "Consumer Discretionary": {фонд: XLY.US, имя: "товары не первой необходимости"}
    "Consumer Cyclical": {фонд: XLY.US, имя: "товары не первой необходимости"}
    "Consumer Staples": {фонд: XLP.US, имя: "товары повседневного спроса"}
    "Consumer Defensive": {фонд: XLP.US, имя: "товары повседневного спроса"}
    "Utilities": {фонд: XLU.US, имя: "электроэнергетика и коммунальные"}
    "Materials": {фонд: XLB.US, имя: "сырьё и материалы"}
    "Basic Materials": {фонд: XLB.US, имя: "сырьё и материалы"}
    "Real Estate": {фонд: XLRE.US, имя: "недвижимость"}
    "Communication Services": {фонд: XLC.US, имя: "связь и медиа"}
  отрасли:      # слово в названии отрасли (General.Industry / GicSubIndustry) → более точный фонд; первое совпадение
    - {слова: ["semiconductor"], кроме: ["solar"], фонд: SMH.US, имя: "чипы и оборудование для них"}   # солнечные панели EODHD относит к «Semiconductors | Solar» — это не чипы
    - {слова: ["aerospace", "defense"], фонд: ITA.US, имя: "оборона и авиакосмос"}
    - {слова: ["uranium"], фонд: URA.US, имя: "уран и атомное топливо"}
    - {слова: ["oil & gas e&p", "exploration & production"], фонд: XOP.US, имя: "добыча нефти и газа"}
  бумаги:       # ручное уточнение там, где отрасль EODHD слишком широкая («программное обеспечение»)
    CIBR.US: ["PANW.US", "CRWD.US", "ZS.US", "S.US", "OKTA.US", "CYBR.US", "FTNT.US", "TENB.US", "RBRK.US", "NET.US"]
    REMX.US: ["MP.US", "USAR.US", "UUUU.US"]
    URA.US: ["CCJ.US", "LEU.US", "UEC.US", "NXE.US"]
    SMH.US: ["NVDA.US", "AMD.US", "ASML.US", "KLAC.US", "LRCX.US", "AMAT.US", "TSM.US", "AVGO.US", "MU.US"]
  имена_фондов:
    CIBR.US: "кибербезопасность"
    REMX.US: "редкоземельные и критические металлы"
    URA.US: "уран и атомное топливо"
    SMH.US: "чипы и оборудование для них"
  карта:        # какие фонды показывать в общей «карте секторов» (ops/sector_view.py show)
    [XLK.US, SMH.US, CIBR.US, XLE.US, XOP.US, XLU.US, XLI.US, ITA.US, XLB.US, REMX.US, URA.US, XLF.US, XLV.US, XLY.US, XLP.US, XLRE.US]
