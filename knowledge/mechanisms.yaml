- id: manufacturing_hub_lockdown
  rule: Административная остановка крупного производственно-портового хаба (локдаун, блэкаут) → производство и вывоз
    падают, заторы и перенос грузов в соседние порты, авиафрахт ↑ → недостача компонентов у глобальных потребителей;
    ПОСЛЕ снятия — волна отложенного груза (эхо-затор в портах назначения). Работает ТОЛЬКО при живом глобальном
    спросе.
  theory: 'Запасы-буфер + узкое горло: хаб уровня Шанхая (20% контейнерного экспорта КНР) соседями полностью не
    замещается; волновая динамика: остановка → пауза → всплеск отгрузок = ДВА шока с интервалом в месяцы.'
  trigger_class: локдаун/ЧП/энергокризис в регионе с долей >5% мирового экспорта категории (Шанхай, Шэньчжэнь, Тайвань,
    корейские кластеры)
  chain:
  - '1) локдаун → фабрики и трукинг встают, очередь судов ↑ (Шанхай апр.2022: сотни судов)'
  - 2) груз в соседние порты (их заторы ↑), авиафрахт ↑; производители на компонентах региона (Tesla и др.) тормозят
    выпуск — 2–6 недель
  - 3) после снятия — всплеск отгрузок → эхо-заторы в портах назначения, временный скачок спот-фрахта; смещение
    выручки брендов между кварталами
  conditions:
  - 'СРАБАТЫВАЕТ: остановка >3–4 недель, глобальный спрос в цикле вверх, доля хаба велика'
  - 'НЕ СРАБАТЫВАЕТ (главный контрпример — сам Шанхай-2022): при развороте спроса вниз выпадение предложения МАСКИРУЕТСЯ
    — ставки продолжили падать'
  - смотреть одновременно индикатор спроса (заказы ритейла, PMI); эффект затухает с диверсификацией производства
    экс-Китай
  lag_weeks: заторы/альтернативный фрахт 2–6; недостача у потребителей 4–10; эхо-волна после снятия 6–13
  precedents:
  - year: '2022'
    event: локдаун Шанхая (апрель–май, ~2 месяца; 20% контейнерного экспорта КНР)
    observed: очередь судов сотни единиц; заторы порта +30–40%; груз ушёл в Нинбо/Циндао; Tesla Shanghai простаивала;
      НО глобальные ставки НЕ выросли — спрос уже падал
    source: https://gcaptain.com/supply-chain-chaos-shanghai-covid-lockdowns/ ; https://www.freightwaves.com/news/get-ready-for-the-next-supply-chain-shockwave
  - year: '2022'
    event: локдаун Шэньчжэня (март)
    observed: морские отправки из Гуандуна −32% (FourKites) за недели; эффект локальный и короткий
    source: https://gcaptain.com/supply-chain-chaos-shanghai-covid-lockdowns/
  watch_assets: очереди судов/заторы портов (Kiel Trade Indicator, congestion-метрики S&P); спот-авиафрахт (TAC
    Index); компании с концентрацией производства в регионе; соседние порты-бенефициары; бренды с квартальным гайденсом
  tradeable: true
  amplitude: локальные объёмы −30%+ за недели; глобальный фрахт от 0 (слабый спрос) до +20–40%
  counterexamples: 'Шанхай-2022: крупнейший локдаун эпохи НЕ поднял фрахт — совпал с разворотом спроса (bullwhip
    вниз). Урок: шок предложения перевозок торгуем только при подтверждённом живом спросе.'
  forward_score:
    вопросов: 0
    исходов: 0
    попаданий: 0
- id: port_labor_stoppage
  rule: Забастовка/локаут в портах с большой долей торговли страны останавливает грузопоток → суда копятся → после
    разрешения затор рассасывается неделями; срывы поставок у ритейла, рост альтернативного фрахта. Ставить только
    на ФАКТИЧЕСКУЮ остановку >1 недели, не на угрозу — большинство конфликтов разрешаются за дни.
  theory: 'Перенос издержек + запасы-буфер: ущерб нелинеен по длительности (первые дни съедают буферы, дальше —
    остановки производств); теория переговоров: обе стороны знают цену дня простоя, поэтому большинство конфликтов
    коротки.'
  trigger_class: истечение коллективного договора портовых профсоюзов / начало забастовки / локаут (ILWU/ILA; даты
    истечения контрактов известны заранее)
  chain:
  - 1) остановка портов → суда на рейде ↑, контейнерооборот узла → 0
  - 2) спот-фрахт обходных маршрутов и авиафрахт ↑; у ритейла сроки поставки ↑
  - '3) при длительности >1–2 недель: дефициты и разовый удар по марже ритейла/автопрома квартала'
  conditions:
  - 'СРАБАТЫВАЕТ: реальная остановка >~1 недели; высокая доля торговли через узел (West Coast ~половина контейнерного
    импорта США в 2002)'
  - 'НЕ СРАБАТЫВАЕТ: быстрое разрешение (Taft-Hartley 2002; сделка ILA за 3 дня в 2024); риск заранее в цене (front-loading
    импорта съедает эффект и создаёт обратный ход — провал объёмов после)'
  - буфер запасов ритейла до события определяет, дойдёт ли удар до 3-го звена
  lag_weeks: 'затор и альтернативный фрахт 1–4; рассасывание после разрешения 4–12 (2002: полное восстановление
    ~6 месяцев); удар по марже грузовладельцев 6–13'
  precedents:
  - year: '2002'
    event: 'локаут ILWU: 29 портов Западного побережья США закрыты 10–11 дней'
    observed: ущерб $1–2 млрд/день (ФРБ Сан-Франциско), суммарно до $15 млрд; 200+ судов на рейде; разбор заторов
      недели, восстановление цепочек ~6 месяцев; завершён по Taft-Hartley
    source: https://www.supplychain247.com/paper/the_national_impact_of_a_west_coast_port_stoppage
  - year: '2024'
    event: забастовка ILA в портах Восточного побережья/Залива (октябрь)
    observed: 3 дня — быстрая предварительная сделка; устойчивого хода в фрахте/акциях не вышло (front-loading заранее)
      — контрпример
    source: https://www.uschamber.com/security/supply-chain/u-s-chamber-letter-on-west-coast-port-negotiations
  watch_assets: контейнерный спот-фрахт на альтернативные берега (FBX East/West спред); контейнерные линии и железные
    дороги-бенефициары перенаправления; импортозависимый ритейл — под давлением; календарь истечения портовых контрактов
    — опережающий индикатор
  tradeable: true
  amplitude: 'при остановке 10+ дней: до $1–2 млрд/день ущерба, многонедельные заторы; при 1–3 днях: шум'
  counterexamples: 'ILA-2024: 3 дня — ничего торгуемого; большинство угроз разрешаются до остановки. Торгуемость
    УСЛОВНАЯ: сигнал = фактическая остановка дольше недели.'
  forward_score:
    вопросов: 0
    исходов: 0
    попаданий: 0
- id: tariff_substitution
  rule: Тарифы/ограничения на товары страны-производителя (Китай) → спрос импортёра перетекает к аналогам в «дружественных»
    юрисдикциях (Вьетнам, Мексика, Индия) → их экспорт, загрузка и рынки вверх; часть потока — переупаковка того
    же китайского товара (transshipment) — проверять глубину локализации. В зоне 3–13 недель торгуемы в основном
    анонсы и первая переоценка бенефициаров — сам тренд квартально-годовой.
  theory: 'Trade diversion (Вайнер): тариф = сдвиг относительных издержек, торговля перенаправляется к ближайшему
    необложенному производителю; тезис T2 владельца напрямую.'
  trigger_class: анонсы тарифных пакетов/повышений ставок на страну или отрасль (tariff + country + % + список товаров)
  chain:
  - 1) анонс → акции экспортёров целевой страны ↓, валюта ↓; рынки-аналоги почти без реакции (лаг — здесь зазор)
  - '2) кварталы: заказы перетекают → экспорт стран-заместителей ↑, их промпарки/логистика ↑'
  - '3) годы: перенос капекса (заводы) → строительство/инфраструктура/банки бенефициаров ↑'
  conditions:
  - 'СРАБАТЫВАЕТ: тариф большой и воспринимается долгосрочным; у заместителя свободные мощности и рабочая сила'
  - 'НЕ СРАБАТЫВАЕТ: тариф-переговорная позиция (быстро отменён); тарифы расширяют на самих заместителей (2025:
    Вьетнам/Мексика) — механизм ломается'
  - 'transshipment-риск: рост экспорта без роста добавленной стоимости хрупок (anti-circumvention)'
  lag_weeks: реакция целевой страны 0–2; торговые потоки 13–52; капекс-нога годы
  precedents:
  - year: 2018-2025
    event: тарифная война США-КНР, раунды 2018-19
    observed: импорт США из Вьетнама более чем удвоился 2018→2025 (>$114 млрд); профицит Вьетнама с США ~$105 млрд
      (~2.5x); доля Китая в торговле США 15.7%→10.9%
    source: https://www.bloomberg.com/graphics/2025-trump-china-new-trade-war/
  - year: '2023'
    event: nearshoring в Мексику
    observed: экспорт Мексики в США впервые за 21 год обогнал китайский; фирмы с тарифной экспозицией нарастили
      экспорт на ~20%
    source: https://cepr.org/voxeu/columns/shifting-sands-cross-border-supply-chains-how-mexico-emerged-key-player-us-china
  - year: '2019'
    event: контраргумент внутри тренда
    observed: значимая часть вьетнамского скачка — реэкспорт китайских товаров (тарифы повышали И экспорт в США,
      И импорт тех же категорий из КНР)
    source: https://uscc.gov/sites/default/files/2024-03/Edmund_Malesky_Testimony.pdf
  watch_assets: страновые ETF бенефициаров (Вьетнам, Мексика, Индия), промышленные REIT/парки и логистика, валюты;
    короткая нога — экспортёры целевой страны
  tradeable: true
  amplitude: торговые потоки десятки % в год; страновые рынки-бенефициары +10–30% на горизонте перестройки; реакция
    на анонс — единицы %
  counterexamples: 'дефицит США не сократился — переехал; 2025: тарифы догнали самих заместителей — ставка ломается,
    когда бенефициар сам становится целью; transshipment-разоблачения бьют по хрупкой части потока.'
  forward_score:
    вопросов: 0
    исходов: 0
    попаданий: 0
- id: reshoring_capex_boom
  rule: 'Промышленная политика с субсидиями (CHIPS, IRA, аналоги) → волна строительства заводов в субсидируемой
    юрисдикции → вверх вся цепочка капекса: инжиниринг/промстрой, электрооборудование/трансформаторы, автоматизация,
    сталь, энергоинфраструктура. Медленный механизм: в зоне 3–13 недель торгуемы анонсы конкретных строек и отчёты
    подрядчиков, не сам тренд.'
  theory: 'Субсидия снижает требуемую доходность частного капекса → пакетный запуск нерентабельных без неё инвестиций;
    мультипликатор строительства: каждый завод тянет сеть подрядчиков (тезис T2: решоринг → промкапекс).'
  trigger_class: принятие/расширение законов промсубсидий; анонсы мегазаводов (fab, гигафабрика) с суммой и площадкой
  chain:
  - 1) закон/анонс → переоценка прямых получателей ↑ (умеренно — выгода размазана)
  - '2) 1–3 квартала: контракты на стройку → инжиниринговые/строительные подрядчики, электрооборудование — выручка
    и акции ↑'
  - '3) годы: локальный спрос на энергию/жильё/логистику вокруг площадок ↑'
  conditions:
  - 'СРАБАТЫВАЕТ: деньги реально выделяются (appropriations, не authorization); у подрядчиков дефицит мощностей
    (растут и цены, и маржа)'
  - 'НЕ СРАБАТЫВАЕТ: политический разворот/заморозка субсидий; проекты-зомби (анонсы без финального инвестрешения)'
  - субсидийный капекс уязвим к смене администрации (IRA-сегменты просели при развороте 2025)
  lag_weeks: переоценка подрядчиков 4–13 после закона/мегаанонса; пик строительных расходов 1–3 года
  precedents:
  - year: 2022-2023
    event: CHIPS Act (авг.2022) + IRA
    observed: реальные расходы на строительство заводов электроники почти ×4 с начала 2022 по апрель 2023; промстроительство
      США ×2 с конца 2021
    source: https://www.presidency.ucsb.edu/documents/white-house-press-release-unpacking-the-boom-us-construction-manufacturing-facilities
  - year: '2024'
    event: продолжение волны
    observed: строительство в электронике ~$11+ млрд/мес (годовой темп ~$135 млрд) к июню 2024; совокупное промстроительство
      ~$206 млрд годовых — рекорд
    source: https://www.piie.com/research/piie-charts/2024/us-chip-construction-spending-skyrocketed-after-us-chips-act-passed
  - year: '2023'
    event: эффект на смежников
    observed: сталелитейщики США фиксировали прирост спроса от CHIPS/инфраструктурных законов (структурная сталь,
      арматура)
    source: https://www.spglobal.com/market-intelligence/en/news-insights/articles/2024/2/us-steel-industry-sees-boost-from-chips-act-infrastructure-bills-80616033
  watch_assets: инжиниринг и промышленное строительство, электрооборудование/трансформаторы, автоматизация, сталь
    для промстроительства; Census construction spending (manufacturing) как индикатор
  tradeable: true
  amplitude: сегмент промстроительства ×2–4 по расходам за 1.5 года; подрядчики +30–100% за год волны
  counterexamples: рост начался ДО принятия CHIPS (PIIE — частично рыночный, приписывать всё закону нельзя); проекты
    замораживались при пересмотре субсидий и слабом спросе (2024-25).
  forward_score:
    вопросов: 0
    исходов: 0
    попаданий: 0
- id: demand_boom_inelastic_supply_cycle
  rule: 'Структурный скачок спроса (электрификация: литий, кобальт) при предложении с лагом строительства в годы
    → кратный рост цены за 12–24 месяца, который сам себя разрушает: высокая цена вызывает волну новых проектов
    и замещение (LFP, натрий) → обвал 70–90% за следующий год. Основное движение — кварталы; в зоне 3–13 недель
    торгуемы только опознаваемые изломы (анонсы крупного предложения, субсидийные развороты).'
  theory: Паутинообразная модель (cobweb) при лаге предложения 3–5 лет против лага спроса в месяцы; эластичность
    предложения в краткосроке ~0, в долгосроке высокая; разрушение спроса при экстремальной цене.
  trigger_class: ускорение проникновения конечной технологии (продажи EV, субсидии) при дефицитном балансе; для
    разворота — анонсы ввода крупных мощностей/отмена субсидий
  chain:
  - 1) спрос EV ↑ при фиксированном предложении → литий/кобальт ↑ кратно за кварталы
  - 2) акции производителей сырья ↑; маржа батарей/EV ↓ → поиск замещения
  - 3) волна нового предложения (лепидолит, Африка) + срез субсидий Китая → цена ↓ 70–90%, маржинальные производители
    банкротятся
  conditions:
  - 'вверх: дефицитный баланс, пустые запасы переработчиков, действующие субсидии'
  - 'разворот: предложение растёт >30% г/г (2023: +38% — так и вышло), субсидии режут, технологии замещения появились'
  - 'НЕ путать с недельным таймингом: ловятся только изломы на конкретных новостях (4–12 недель)'
  lag_weeks: 26–100 полный цикл (за пределами зоны охоты); отдельные изломы 4–12
  precedents:
  - year: 2021-2022
    event: EV-бум против неэластичного предложения лития
    observed: карбонат лития Китай +346% за 2021; от июня 2020 к пику ноября 2022 ~14x (до ~600 000 юаней/т)
    source: https://spglobal.com/marketintelligence/en/news-insights/latest-news-headlines/tight-lithium-market-driving-up-battery-prices-67868122
  - year: 2023-2024
    event: ответ предложения (+38% в 2023) + срез китайских EV-субсидий
    observed: обвал с пика на ~88% (до ~72 500 юаней/т); прогнозы банков 2022 года оказались сильно завышены
    source: https://arc-dev.theglobeandmail.com/investing/investment-ideas/article-have-lithium-prices-bottomed-yet
  watch_assets: китайский спот карбоната лития (LIT ETF; Albemarle/SQM/Pilbara-класс); темп ввода мощностей и субсидийные
    решения Китая как датчики разворота; отраслевые балансы
  tradeable: false
  amplitude: вверх 3–14x за 1–2 года; вниз 70–90% за год; недельные фрагменты ±10–20% на изломах
  counterexamples: 'главная ловушка — экстраполяция: на пике 2022 консенсус ждал вечного дефицита, предложение ответило
    быстрее. tradeable=false ДЛЯ ЗОНЫ 3–13 НЕДЕЛЬ: как квартальная рамка механизм рабочий, его изломы дают недельные
    сделки — использовать как контекст для V6, не как самостоятельную печать.'
  forward_score:
    вопросов: 0
    исходов: 0
    попаданий: 0
- id: banking_stress_flight_to_quality
  rule: 'Крах/стресс значимого банка запускает бегство в качество и мгновенную переоценку ставок ЦБ вниз: короткие
    доходности обваливаются, золото и трежерис растут, банковский сектор падает. Ядро отыгрывается за дни (неторгуемо);
    потенциально торгуемы вторичные ходы — пересмотр политики ЦБ, сжатие кредита малому бизнесу.'
  theory: 'Бегство в качество + переоценка функции реакции ЦБ: финстабильность временно доминирует над инфляционной
    целью; сжатие кредитного предложения малых банков действует как квази-ужесточение с лагом в кварталы.'
  trigger_class: крах/экстренная санация значимого банка; экстренные программы ликвидности ЦБ; резкое падение акций
    региональных банков
