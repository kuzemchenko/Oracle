- id: curve_inversion_recession_clock
  rule: 'Инверсия кривой доходности (2s10s/3m10y) предсказывает рецессию с лагом 6–24 месяца (медиана ~15–16 мес.)
    — это ЧАСЫ режима, а не торговый сигнал в зоне 3–13 недель. Торгуемый дериват в нашей зоне — bull steepener:
    когда ЦБ НАЧИНАЕТ цикл снижения, короткий конец падает быстрее длинного и кривая раз-инвертируется за недели.'
  theory: 'Инверсия = рынок ждёт, что будущие короткие ставки будут ниже текущих (ожидание смягчения из-за слабости
    экономики); плюс канал банковской маржи: банки занимают коротко/кредитуют длинно — инверсия сжимает маржу и
    охлаждает кредитование, сама приближая рецессию'
  trigger_class: 'Как часы: первая устойчивая инверсия 2s10s. Как торгуемый триггер: первое снижение ставки ЦБ /
    явный сигнал старта цикла снижения при инвертированной кривой'
  chain:
  - 1) (медленно, месяцы) инверсия → сжатие банковской маржи → охлаждение кредита → замедление экономики
  - 2) (торгуемо, недели) старт цикла снижения → 2Y ↓ быстрее 10Y → кривая раскручивается (bull steepening), длинная
    дюрация ↑ умеренно
  - 3) исторически сама ДЕ-инверсия ближе к рецессии, чем инверсия → в де-инверсию risk-off активы (золото, защитные
    сектора) получают попутный ветер
  conditions:
  - Как таймер рецессии — разброс лага огромен (6–24 мес.), в окне 3–13 недель НЕ торгуем
  - Steepener торгуем только при подтверждённом старте цикла снижения; инверсия без снижений может углубляться квартал
    за кварталом (2022–2023)
  - 'Сигнал ослаблен эпохой QE/QT: искажение term premium покупками ЦБ снижает информативность инверсии (главный
    контрпример — 2022–2024)'
  lag_weeks: 26–104 до рецессии (вне зоны охоты — часы режима); 4–13 для стипенера после первого снижения ставки
    — торгуемая часть
  precedents:
  - year: 1955–2019
    event: 10 рецессий США
    observed: Каждая началась через ~6–24 месяца после инверсии 2s10s (SF Fed); по эпизодам 1978–2019 медиана лага
      ~15–16 месяцев
    source: https://www.lambdafin.com/articles/yield-curve-inversion-recession-lead-time
  - year: '2024'
    event: Старт цикла снижения ФРС (сентябрь, −50 бп) при инвертированной кривой
    observed: 2s10s де-инвертировался в сентябре 2024 после рекордных ~26 месяцев инверсии; стипенинг шёл неделями
      вокруг первого снижения
    source: https://eco3min.fr/en/yield-curve-inversion-deinversion-recession-signal/
  - year: '2019'
    event: Инверсия 3m10y/2s10s августа 2019
    observed: Рецессия пришла в марте 2020 (~7 месяцев) — формально в окне 6–24 мес., но триггером стал ковид; чистота
      сигнала спорна
    source: https://www.benzinga.com/news/22/03/26245660/recession-indicator-what-an-inverted-yield-curve-means-for-investors
  counterexamples: 'ГЛАВНЫЙ: инверсия июля 2022 — рекордные ~2 года инверсии, де-инверсия в 2024, а рецессии в США
    к концу 2025 так и не случилось — сигнал впервые за 60+ лет дал (пока) осечку, вероятно из-за QE-искажений term
    premium и постковидных балансов домохозяйств. Инверсия 1998 — рецессии не было до 2001.'
  watch_assets: Спред 2s10s и 3m10y (FRED), фьючерсы SOFR/Fed Funds, стипенер-позиции (длинный короткий конец против
    длинного), банковский сектор (маржа), золото в фазе де-инверсии
  tradeable: false
  amplitude: 'Сам спред: от −100 бп (пик инверсии 2023) до +50–100 бп за 2–3 квартала раскрутки; на старте цикла
    снижения стипенинг ~30–60 бп за 4–13 недель'
  forward_score:
    вопросов: 0
    исходов: 0
    попаданий: 0
