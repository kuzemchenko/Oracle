# knowledge/thesis_edges.yaml — V6 (карта v3): рёбра-кандидаты ИЗ ТЕЗИСОВ ВЛАДЕЛЬЦА (31.10)
# и механизмов библиотеки. КУРИРУЕМЫЙ конфиг: правки только через git с ревью.
#
# П16: это ГИПОТЕЗЫ-кандидаты, не боевые рёбра. Прогнозную силу зарабатывают ФОРВАРДОМ:
# orchestrator/thesis_edges.py --apply добавляет их в append-only реестр
# knowledge/edge_candidates.jsonl (origin=thesis, с провенансом тезис+механизм), откуда
# B4 (edge_forward, крон 07:30) тестирует их ежедневно наравне с библиотекой, а
# forward_promotion копит статистику. Лаг 0 = «не измерен, зарабатывается тестом» —
# как у кандидатов Э4(ж).
#
# Ограничение честности: источник и инструмент — ТОЛЬКО тикеры универсума (config/
# universe.yaml), иначе у сервера нет котировок и тест молча голодает. Поэтому часть
# следствий тезисов здесь отсутствует осознанно:
#   - T2 оборонка/решоринг (rearmament_cycle, reshoring_capex_boom): в универсуме нет
#     ЦЕНОВОГО источника-триггера (бюджетные анонсы — события, не ряд) — честно ждёт
#     расширения универсума через субботние карточки тем;
#   - газ Европы (TTF) как источник для CF: TTF-прокси в универсуме нет; взято UNG
#     (Henry Hub) с честной пометкой о спорном знаке.

версия: 1
создано: "2026-11-02"
источник: "тезисы владельца T1/T2 (knowledge/theses_owner.yaml) × механизмы библиотеки (knowledge/mechanisms.yaml); курировано облачной сессией 02.11"

рёбра:
  # ── T1: энергия и потоки ─────────────────────────────────────────────────────
  - тезис: T1_потоки_критических_активов
    механизм: energy_supply_shock
    источник: USO.US
    инструмент: FRO.US
    причинность: "нефтяной шок → перестройка маршрутов → спрос на танкерный тоннаж (Frontline, сырая нефть)"
  - тезис: T1_потоки_критических_активов
    механизм: refinery_capacity_shock
    источник: BNO.US
    инструмент: STNG.US
    причинность: "Brent-шок/перебои переработки → плечи перевозки нефтепродуктов длиннее → продуктовозы (Scorpio)"
  - тезис: T1_потоки_критических_активов
    механизм: fuel_substitution_demand_shock
    источник: UNG.US
    инструмент: LNG.US
    причинность: "газовый шок → переключение спроса на СПГ → экспортёр Cheniere"
  - тезис: T1_потоки_критических_активов
    механизм: gas_ammonia_cascade
    источник: UNG.US
    инструмент: CF.US
    причинность: "газ → аммиак/удобрения (CF)"
    заметка: "знак спорный: Henry Hub — ИЗДЕРЖКИ CF, а выручку двигает ЕВРОПЕЙСКИЙ газ (TTF, прокси в универсуме нет); форвард-тест сам покажет знак и силу — за этим и кандидат"
  - тезис: T1_потоки_критических_активов
    механизм: chokepoint_disruption
    источник: LNG.US
    инструмент: GLNG.US
    причинность: "экспортёр СПГ разогревается → фрахт СПГ-судов (Golar)"
  - тезис: T1_потоки_критических_активов
    механизм: chokepoint_disruption
    источник: LNG.US
    инструмент: FLNG.US
    причинность: "экспортёр СПГ разогревается → фрахт СПГ-судов (FLEX LNG)"
  # ── T1: вычисления и энергия для ЦОД ─────────────────────────────────────────
  - тезис: T1_потоки_критических_активов
    механизм: datacenter_power_demand
    источник: VRT.US
    инструмент: ETN.US
    причинность: "капекс ЦОД (Vertiv — прямой индикатор) → электрооборудование и распределение энергии (Eaton)"
  # ── T1/T2: критические материалы ─────────────────────────────────────────────
  - тезис: T1_потоки_критических_активов
    механизм: mine_supply_shock_concentrate
    источник: CPER.US
    инструмент: FCX.US
    причинность: "цена меди → крупнейший добытчик с собственным концентратом (Freeport)"
  - тезис: T1_потоки_критических_активов
    механизм: mine_supply_shock_concentrate
    источник: CPER.US
    инструмент: SCCO.US
    причинность: "цена меди → Southern Copper (низкие издержки, высокая чувствительность прибыли)"
  - тезис: T2_сдерживание_Китая
    механизм: critical_materials_export_control
    источник: CPER.US
    инструмент: COPX.US
    причинность: "цена меди → корзина добытчиков вне Китая (ETF COPX) — бенефициары ограничений на китайскую переработку"
