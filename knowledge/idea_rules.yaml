# knowledge/idea_rules.yaml — ЕДИНЫЙ ИСТОЧНИК ПРАВИЛ КАЧЕСТВА ИДЕИ (правила v3; владелец 15.11: вариант «Б»,
# по ревью Fable 14.11: «жёсткий брак — только за ложный факт, неторгуемый инструмент и отсутствие правила выхода;
# остальное — пометки»).
#
# Читают: ops/idea_gate.py и ops/evidence_check.py (каждое нарушение помечено номером правила; брак это или
# пометка — решает ЭТОТ файл), ops/hunter_court.py (за какие пункты рубрики суд вправе «убить»),
# задания охотнику (.claude/workflows/hunt-idea.js велит прочитать этот файл) и суду.
# П8 (факты со ссылкой) и §9 (честный счёт прогноза) — инварианты: их правила всегда брак.
#
# действует_с: дата охоты, с которой правила v3 в силе. null — ещё не включены (правило 01.11: ручной прогон →
# «ок» владельца → дата). До даты — прежнее поведение (всё ниже — брак, как в правилах v2).
версия: 3
действует_с: null

брак:        # идея не уходит владельцу
  - id: ФАКТЫ
    текст: "Факты подтверждены: не меньше 3 фактов со ссылкой и датой публикации из 2+ разных источников, без дат «из будущего»; регуляторика проверена по полному тексту с исключениями; «документа нет» — только с записью проверки; показатели — с базисом и периодом; время события и причина хода цены не выдуманы (П8)."
  - id: ТОРГУЕМОСТЬ
    текст: "Бумагу можно купить: тикер EODHD *.US с именем и ролью компании, направление вверх/вниз, цена не ниже $5."
  - id: ВЫХОД
    текст: "Есть правило выхода: цена входа, цель и стоп; хотя бы одно условие «что меня опровергнет» с датой проверки не позже сверки."
  - id: СЧЁТ
    текст: "Прогноз можно честно проверить (§9): порог заякорен к свежей цене, срок в окне класса горизонта, вероятность для журнала 0.05–0.95, сверка не раньше события; это то, по чему система ведёт счёт своих ошибок."

пометки:     # не убивают — идут в лист ставки и текст строкой «что слабо»
  - id: КАТАЛИЗАТОР
    словами: "событие, которое должно сдвинуть цену, не датировано или далеко"
    текст: "Катализатор описан и (для короткого горизонта) датирован в окне 3–13 недель."
  - id: ПРЕЦЕДЕНТ
    словами: "похожий случай из прошлого не подтверждён числом или ссылкой"
    текст: "Прецедент того же механизма с числовой амплитудой и ссылкой; посчитан ход бумаги с даты повода; доля «уже в цене»."
  - id: АСИММЕТРИЯ
    словами: "возможный выигрыш меньше чем в полтора раза больше возможной потери"
    текст: "Потенциал до цели от худшего входа хотя бы в 1.5 раза больше риска до стопа (это видно и в листе ставки в долларах)."
  - id: ПРОЦЕНТЫ
    словами: "проценты в тексте автора не сошлись с ценами — их пересчитал код"
    текст: "Проценты, заявленные автором, сходятся с ценами карточки (проценты всё равно считает код)."
  - id: РЫНОК
    словами: "не показано, чего рынок уже ждёт и чем наш сценарий отличается"
    текст: "Показано, что рынок уже ждёт и чем отличается наш сценарий (числа, источник)."
  - id: СУЩЕСТВЕННОСТЬ
    словами: "не посчитано, насколько эффект заметен для прибыли компании (или он мал)"
    текст: "Эффект посчитан относительно прибыли/выручки/капитализации компании и не шум."
  - id: УСТОЙЧИВОСТЬ
    словами: "не показано, почему эффект продержится"
    текст: "Устойчивость эффекта подкреплена проверяемым фактом."
  - id: ЦЕПОЧКА
    словами: "связь от события до компании держится на неподтверждённом звене"
    текст: "Звенья от повода до бумаги показаны, каждое с качеством связи; не больше одного звена-гипотезы."
  - id: ЦЕЛЬ
    словами: "цель цены не подкреплена расчётом — она предварительная"
    текст: "Цель цены пересчитывается по формуле (target_basis); иначе — «цель предварительная»."
  - id: КТО_ПРОДАЁТ
    словами: "не сказано, кто продаёт эту бумагу и почему может ошибаться"
    текст: "Сказано, кто продаёт нам и почему может ошибаться (по возможности)."

суд:
  убивает_только_пункты: [1]       # 1 — карточка сама показывает, что бизнес компании не связан с поводом
  правило: "Суд проверяет и чинит. «Убить» идею (FATAL) — только если карточка САМА показывает, что бизнес компании не связан с поводом (пункт 1), с дословной цитатой-уликой. Нет канала к деньгам, знак не сходится, прецедент чужого механизма, нет ответа на главный риск — это доработка (FIX): идея уходит владельцу со строкой «вторая проверка»."
