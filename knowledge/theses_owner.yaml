# knowledge/theses_owner.yaml — макро-тезисы ВЛАДЕЛЬЦА (мировоззрение «мудрого экономиста»)
# Записано со слов владельца 31.10.2026 (голос в облачной сессии). Статус по П8/П16: это
# ГИПОТЕЗЫ-РАМКИ, не факты и не прогнозы — прогнозной силой тезис наделяется ТОЛЬКО через
# форвард-проверку: тезис → наблюдаемые следствия → запечатанные §9-вопросы («Шансы недели»,
# этап V5 карты v3) → счёт попаданий. Тезис с плохим счётом честно помечается, не удаляется.
# Логика голоса (слова владельца): «где-то убудет — где-то прибудет; нехватка ресурса — рост
# цены; спрос выше предложения — рост цены; просто, без интегралов, через обычную логику
# распределения потоков». Роль в системе: генератор ТЕЗИСОВ и ЦЕПОЧЕК для V5/V6 —
# не оракул; его идеи проходят те же печати и суд-аргументатор, что и все.

версия: 1
создано: "2026-10-31"
источник: "владелец, голосом, сессия 31.10 (большой разбор)"

тезисы:
  T1_потоки_критических_активов:
    формулировка: >
      США (администрация Трампа) управляют мировым порядком через контроль потоков
      сложно-воспроизводимых активов: энергия, вычисления (чипы/ЦОД), таланты,
      критические материалы (редкоземы, уран, медь...), военные технологии.
      Обострения (в т.ч. инициированные или подогретые) → переоценка этих потоков.
    наблюдаемые_следствия:
      - "эскалация на Ближнем Востоке / у проливов → рост цен энергоносителей и фрахта танкеров"
      - "экспортные ограничения на чипы/оборудование → переоценка производителей и их замещающих"
      - "санкции/тарифы на критические материалы → рост цен внебиржевых поставщиков вне Китая"
    кандидаты_цепочек: ["энергия: нефть/газ → фрахт → экспортёры СПГ → энергоёмкие производства",
                        "вычисления: ограничения → чипмейкеры вне Китая → энергия для ЦОД",
                        "материалы: редкоземы/уран/медь → добытчики вне Китая → переработчики"]
    счёт_форварда: {вопросов_запечатано: 0, исходов: 0, попаданий: 0}
  T2_сдерживание_Китая:
    формулировка: >
      Стратегия США — системное соревнование с Китаем и его блокирование: Китай постепенно
      выдавливается как производительная сила и поставщик (тарифы, ограничения, решоринг).
      Бенефициары — альтернативные производители: Европа, Индия, Мексика, Юго-Восточная Азия,
      и внутренние производства США.
    наблюдаемые_следствия:
      - "новые тарифы/ограничения на китайские товары → рост акций европейских/индийских/мексиканских производителей-аналогов"
      - "решоринг/friend-shoring → рост промышленного капекса, автоматизации, стройки в США/союзниках"
      - "ответные меры Китая (редкоземы, рынки сбыта) → удар по зависимым от Китая западным компаниям"
    кандидаты_цепочек: ["тарифы → производители-аналоги вне Китая → их поставщики",
                        "решоринг → автоматизация/робототехника/строительство промобъектов",
                        "ответ Китая → редкоземы → западные ВПК/авто/электроника"]
    счёт_форварда: {вопросов_запечатано: 0, исходов: 0, попаданий: 0}

правила_голоса_экономиста:
  - "базовая логика: дефицит/профицит, спрос/предложение, перенаправление потоков — без эзотерики"
  - "каждый тезис обязан рождать ПРОВЕРЯЕМЫЕ следствия-вопросы (§9: порог, срок, источник цены)"
  - "идея из тезиса наследует его форвард-счёт — владелец видит «этот взгляд пока сбывался в X%»"
  - "тезис не доказывается историей (П16) и не считается истиной из-за авторитета автора (П8)"
расширение: "новые тезисы добавляются владельцем словами (бот/голос) или предлагаются
  экономистом-агентом на утверждение кнопкой — через ту же петлю, что очередь тем (V2)"
