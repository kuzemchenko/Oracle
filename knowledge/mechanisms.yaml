    source: https://www.spglobal.com/energy/en/news-research/latest-news/crude-oil/030922-feature-hungry-for-diesel-europe-looks-to-us-and-asia-to-fill-russia-gap
  - year: '2012'
    event: эмбарго ЕС на иранскую нефть (решение янв., вступление 01.07)
    observed: Brent $110 → ~$121 к концу февраля (5 недель); экспорт Ирана 2.2 → ~1.9 млн б/д к марту и −~40% за
