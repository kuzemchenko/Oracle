    of devices)'
  chain:
  - 1) Инцидент → акции вендора-виновника ↓ двузначно в первые 1–2 дня
  - '2) Через 1–6 недель → продолжение падения виновника на исках/оценках ущерба (CrowdStrike: −11% день → −25%
    за 2 дня → −30% за 30 дней) И рост конкурентов (SentinelOne +26% за 30 дней)'
  - '3) Через 8–26 недель → развилка: если renewals устояли — виновник откупается (затухание); если клиенты ушли/регулятор
    прижал — тренд закрепляется'
  conditions:
  - Масштаб хода пропорционален ВИДИМОСТИ ущерба клиентов (остановленные аэропорты 2024 ≫ тихий шпионаж SolarWinds
