# knowledge/idea_bar.yaml — ПЛАНКА «КЛАССНОЙ ИДЕИ ДНЯ» (архитектура охоты v3, 02.11.2026)
#
# Вердикт владельца 02.11: «ты даёшь идею — и тут же её убиваешь; значит, идея была слабой, значит,
# ты не там искал — поправь архитектуру. Каждый день — классная идея, а не помойка с выводом
# «сегодня ничего»».
# Разбор пятью взглядами (Баффет, читательница с финансовым образованием, владелец, оценщик
# полезности, архитектор; reports/product_tests/telegram_eyes_2026-11-02.md): 6 утренних пушей
# 26–31.10 — 0 идей из 6, оценка 2/10; записка охотника MP — 6/10. Корень в коде: жанр «защищаю»
# требовал матожидание > 0, а матожидание считалось через ОДНУ сбываемость потока 48% → всегда минус
# → «защищать нечего» каждый день по построению; плюс суд писал «продавец, скорее всего, прав».
#
# ПРИНЦИП: планка задаётся ДО поиска. Разведчики ищут то, что ей удовлетворяет, и сами прогоняют
# кандидата через шлагбаум кодом (ops/idea_gate.py). Суд — проверка с починкой, а не казнь.
# Отвергнутая с уликой идея — семя следующего круга (следующее звено цепочки), не тупик.
# Владельцу уходит ТОЛЬКО идея, которую система защищает; наблюдения — по запросу.
# Честность (П8/П16/Инв#6) неприкосновенна: факты с URL и датой, вероятности владельцу не печатаются
# (только счёт метода из журнала), каждая идея запечатана §9 до исхода.

version: 1

hard:      # провал любого = идея не годится; 1–8 проверяет КОД (ops/idea_gate.py), 9–10 — суд
  - "1. Карточка полная: тикер EODHD *.US с именем и ролью компании, направление, катализатор, факты, прецедент, стоп-условия, §9-спека."
  - "2. Катализатор ДАТИРОВАН и лежит в окне [сегодня … +13 недель]."
  - "3. Горизонт сверки 3–13 недель и не раньше катализатора."
  - "4. ≥3 несущих факта с URL и датой, ≥2 разных источника (П8)."
  - "5. Прецедент с ЧИСЛОВОЙ амплитудой и URL; ход ЭТОЙ бумаги с даты повода — числом; рынок не съел прецедентный ход (priced_in: не «большая часть в цене», не «перелёт»). Ход считает КОД из цен: закрытие в день повода (trigger_date/trigger_close) против последнего закрытия; на сервере — по его котировкам (перепроверка №2, 03.11)."
  - "6. Асимметрия ≥ 1.5 от ХУДШЕГО входа: потенциал до цели (target_price) / риск до стопа (stop_price) от entry_limit (или последней цены) — проценты считает код, заявленные автором обязаны сходиться с ценами (±2 п.п.)."
  - "7. ≥1 стоп-условие «что меня опровергнет» с датой проверки не позже сверки."
  - "8. §9: порог заякорен к свежей (≤10 дней) цене закрытия, 0.5×..2×, на дальней стороне; сырая вероятность 0.05–0.95 — только для журнала и счёта, владельцу НЕ показывается."
  - "9. Несущие факты подтверждены факт-чекером по URL (линза facts = PASS)."
  - "10. Механизм реален: бизнес бумаги действительно связан с поводом (линза Баффета не FATAL)."
  - "11. Канал к деньгам ЭТОЙ компании — фактом с URL: доля сегмента в выручке, контракт, ценовая гарантия, валюта издержек против валюты выручки, доля рынка. Без такого факта механизм не доказан."
  - "12. Один знак везде: направление заголовка = знак, который механизм даёт ЭТОЙ компании = direction в §9; если прецедент описывает переменную с противоположным знаком (бумага выигрывает от падения переменной) — объяснено одной фразой."
  - "13. Прецедент ТОГО ЖЕ механизма (та же переменная, тот же знак шока) — подобранный по словам прецедент считается отсутствующим."
  - "14. «Кто продаёт и почему ошибается» пишет защитник идеи: кто, почему ошибается или вынужден продавать, один проверяемый факт. Честный ответ «он, скорее всего, прав» = идея не годится."
  - "15. У главного риска есть ответ с числом или фактом; без ответа — FIX, после починки без ответа — не лид."
  - "16. Цена бумаги ≥ $5 (проверяет код); ликвидность — бумага крупного/среднего размера с ежедневным оборотом в десятки миллионов долларов (подтвердить фактом при сомнении)."

soft:      # не убивают — влияют на ранг при выборе идеи дня
  - "Свежесть: малая доля прецедентного хода уже пройдена."
  - "Простота: 2–3 звена от повода до бумаги, каждое — одно человеческое предложение."
  - "Структурный продавец: продаёт по обязанности или привычке (индекс, мандат, налоги, инерция), а не потому что знает больше."
  - "Близость катализатора: решение в ближайшие 1–6 недель лучше, чем через 12."
  - "Понятность за минуту умному обывателю (тест читательницы)."
  - "Связь с тезисами владельца T1/T2 (knowledge/theses_owner.yaml)."

zones:     # где искать: там, где у малого честного игрока преимущество возможно структурно
  A: "Недосчитанные дальние звенья: рынок отыграл повод, но не второе-третье звено (поставщик, заказчик, заместитель). Мерить ход ЗВЕНА, не повода."
  B: "Календарные развилки с асимметрией: датированные решения в 3–13 недель (регуляторные сроки, тарифы, ОПЕК, суды, истечение контрактов, выборы) — один исход даёт большой ход, а цена закладывает другой."
  C: "«Сухой порох»: механизмы библиотеки, чьи условия срабатывания выполнены сейчас (запасы, мощности, режим), событие ещё нет — вахта с датированным триггером входа."
  D: "Отставшие рёбра: источник сдвинулся числом, цель ещё нет (knowledge/edge_candidates.jsonl, форвард-тест B4)."
  E: "Особые ситуации с ВЫНУЖДЕННЫМ продавцом: исключения из индексов и ребалансировки, спин-оффы, налоговые продажи ноября–декабря у сильно упавших бумаг с целым бизнесом, падшие ангелы, выход из банкротства. Ответ «кто продаёт и почему неправ» здесь структурный."
  F: "Тезисы владельца T1/T2: ближайший датированный катализатор конкретного бенефициара."
  G: "Ротация доменов вне библиотеки (фарма/FDA, люкс, Япония/Индия, страхование, агро-технологии, телеком/спутники, оборонка вне США)."
  N: "Круг 2+: СЛЕДУЮЩЕЕ ЗВЕНО отвергнутых идей — если механизм верен, а бумага уже отыграла, ищем поставщика/заказчика/заместителя дальше по цепочке."

court_rules:
  - "Суд ПРОВЕРЯЕТ и ЧИНИТ. Бремя доказательства — на суде: FATAL только с уликой (URL и/или число)."
  - "FATAL вправе только за: ложный несущий факт; звено отыграно ЧИСЛОМ (≥70% прецедентной амплитуды пройдено этой бумагой или катализатор уже разрешился); нет катализатора в окне 3–13 недель; неликвидность; ложный механизм (бизнес не связан с поводом)."
  - "НЕ основания для FATAL: «тема в новостях», «дата известна всем», «аналитики уже пишут», «рынок эффективен». Это вопрос ЦЕНЫ — отвечать числом или FIX с точным запросом."
  - "Сомнение = FIX с конкретным запросом («найти первоисточник для …», «досчитать опционный ход к дате …»), не FATAL. FIX исполняет починщик, упавшая линза перепроверяет."
  - "Возражение суда идёт в текст ВМЕСТЕ с ответом идеи. Если честного ответа нет — это FIX или FATAL, а не строка «продавец, скорее всего, прав» в пуше."
  - "Круги поиска: нет защищаемой — следующий круг в других зонах с обратной связью (не повторять бумаги и ошибки, семена следующего звена); до 3 кругов."
  - "Линзы мерят горизонт 3–13 недель: мерка «владеть пять лет» запрещена; Баффет спрашивает про понятность, пол/стоп, риск допэмиссии/банкротства в окне, реальную связь бизнеса с поводом."
  - "Пустой вердикт, «placeholder» или ответ без улики — не голос: линза перезапускается, такой ответ никогда не считается опровержением."
  - "ВЕТО НАДО ЗАРАБОТАТЬ: каждый отвергнутый с уликой кандидат с полной §9-спекой печатается ТЕНЬЮ (idea_<дата>_killed.shadow.json → трек hunter_killed, владельцу не показывается). При 20+ сверенных тенях код сравнивает сбываемость отвергнутых и выбранных; если отвергнутые не хуже — суд теряет право убивать по «в цене»/«нет катализатора»."
  - "П10 (ревью 02.11): облачный охотник — ГЕНЕРАТОР (семейство anthropic) со своей самопроверкой; состязательный суд РАЗНЫХ семейств стоит на СЕРВЕРЕ ДО доставки (ops/hunter_court.py): критик (не anthropic) → слепой судья (ни генератора, ни критика), позиции в перемешанном порядке, рубрика планки. FATAL → идея не уходит, пишется тенью; FIX → уходит со строкой «вторая проверка»; суд недоступен → непроверенное не шлём (fail-closed). Последний арбитр — форвард-счёт трека hunter_idea."
  - "Шлагбаум исполняется КОДОМ НА СЕРВЕРЕ (hunter_seal.server_check: серверная дата, серверная цена закрытия для якоря порога, добор истории бумаги); новая идея без §9-карточки не уходит; одна печать на идею."

push_template: |
  ЖАНРЫ — только два: «Идея дня» (вход сейчас) и «Идея с триггером» (вход по условию с датой). «Наблюдение» лидом не бывает.
  Строго по абзацам (заголовки абзацев — как ниже, жирного/эмодзи нет), авторский текст не больше 300 слов:
  1) Заголовок-тезис с глаголом: «Идея дня — <число месяц>. <Компания> (<ТИКЕР без .US>) — <роль простыми словами>: ставлю на <рост/снижение> к <дата сверки>, потому что <одна причина>.» Для триггера: «Идея с триггером — <число месяц>. <Компания> (<ТИКЕР>) — <роль>: ставлю на <рост/снижение>, если к утру <день недели, сверенный с календарём> <дата> <условие>.»
  2) «Что это значит для тебя.» Одна-две фразы ДО объяснений: что делать сегодня (войти / ждать триггера с датой / ничего до даты X) и дата следующего шага. Обещать сообщения можно только те, что шлёт код: напоминание бота в день катализатора и итог после даты сверки (перепроверка №4: обещания без исполнителя запрещены).
  3) «Что происходит.» Повод и механизм в 2–3 предложениях экономики: кто кому будет платить больше и почему это попадает в выручку именно этой компании. Каждое звено цепочки — одно человеческое предложение; против звена — учтено ли рынком.
  4) «Почему это ещё не в цене.» Абзац ПИШЕТ КОД (бот подставит ход с даты повода по серверным ценам и фазу против похожего случая — ops/hunter_seal.render_numbers); автор может дать черновик, он будет заменён. Для красивой фразы дай в карточке trigger_what — что было поводом («объявления продления перемирия»).
  5) «Похожий случай.» Один датированный прецедент с числом — в кавычках «…» — и один контрпример; почему наш случай ближе к первому.
  6) «Сколько можно заработать и чем рискую.» Абзац ПИШЕТ КОД по ценам цели, стопа и худшего входа (±$ на $500, ±%, асимметрия словами) — автор его не сочиняет; черновик будет заменён.
  7) «Кто продаёт и почему он ошибается.» Аргумент, а не капитуляция; структурная причина, если есть.
  8) «Главный риск — и мой ответ.» Сильнейшее возражение суда одной фразой и честный ответ на него.
  9) «Что меня опровергнет.» Два-три события с датами проверки.
  10) «Что делать.» Вход (цена «не дороже $X» или условие с датой), цель (= порог прогноза), стоп, дата выхода; под текстом кнопки [Качаем 2 дня] [Беру на бумагу] [Что ещё было] [Мимо: не понял | не верю | поздно]. «Решение за тобой.»
  Последняя строка дословно: «Это исследовательский инструмент, не инвестиционная рекомендация.»
  Сверка кодом (бот, ops/hunter_seal.push_card_mismatch): заголовок однозначно называет сторону ставки («ставлю на рост/снижение») = direction карточки; цель, стоп (цены) и дата сверки §9 из карточки есть в тексте — иначе пуш не уходит.
  ЯЗЫК (просьба владельца 03.11): популярный, как в хорошей деловой журналистике для умного читателя с высшим образованием, но не инвестора — короткие предложения, сначала смысл, потом детали; ни одного слова из «кухни» (механизм, звено, катализатор, триггер, прокси, моментум, асимметрия — переводить на обычный язык); авторский текст ≤300 слов.
  Понятность (отзыв владельца 03.11): каждый специальный термин и каждое событие-повод — одной фразой простыми словами (ЧЬЯ пауза, ЧЕЙ указ, КАКИЕ запреты, что такое «пол цены»); никаких отсылок к тому, что читатель «должен знать» из исследования.
  Исправление уже отправленной записки уходит владельцу ТОЛЬКО с абзацем «Что изменилось.» сразу после заголовка (что именно и почему); правка формулировок без новостей — тихая замена, сообщения нет.
  Правила: ≤8 чисел вне кавычек и ≤14 во всём тексте (даты не считаются); тикер один раз, без «.US», рядом имя и роль; дни недели сверены с календарём; строку о печати прогноза и счёт метода НЕ писать — их допишет код бота.

banned_in_push:
  - "Объявления о собственной честности: «показываю честно», «— честно», «Главное возражение суда — честно». Честность показывают числа и печать."
  - "Пустые действия: «Решение за тобой», когда решать нечего; «Что делать. Ничего» без даты следующего шага."
  - "Индекс рынка (SPY) как звено цепочки; прецедент чужого механизма; направление против собственного механизма."
  - "«Наблюдение дня», «Сегодня защищать нечего», «показываю самое интересное наблюдение» — пуш без защищаемой идеи не уходит."
  - "Признание правоты другой стороны («продавец, скорее всего, прав», «нет веских доказательств их неправоты»)."
  - "Любые вероятности, шансы, коэффициенты, матожидание — цифрами и словами («четыре к одному», «в трети случаев», «вероятно»)."
  - "Внутренняя кухня: «картограф», «исток», «выдача», «инверсия», «ярус», «edge», «RSI», «скользящие», «до выдачи не дошёл», «в цепочке пропуск»."
  - "Тикеры без имени и роли; «компанию не опознал» в лиде."
  - "Две несогласованные цифры одного хода; «остаток» без полного хода; «полный ход не посчитан — честно» в лиде."

usefulness:   # как измеряем полезность (метрики — reports/product_tests/telegram_eyes_2026-11-02.md)
  - "ДИД — доля дней с защищаемой идеей: дни с пушем «Идея дня» (защищаемой, с печатью §9) / дни. Цель ≥0.8 за 20 торговых дней."
  - "ИС — индекс самоопровержения пуша (признание правоты продавца, знак шапки против текста звена, две цифры одного хода, «защищать нечего», суд «слабая»): цель 0 у 100% лидов."
  - "Тест понимания: читательница пересказывает идею, деньги/срок и «что делать сегодня» без ошибок — доля верных пересказов."
  - "Отклик владельца: нажатия «Качаем 2 дня»/«Мимо» на пуш (journal/decisions_user.jsonl) — доля пушей с реакцией и доля «Качаем»."
  - "Счёт метода: сбылось K из N сверенных идей охотника против БАЗЫ «случайного взгляда» — сколько тех же §9-вопросов сбылось бы от одной обычной качки цены (mathlib/base_odds.py, считается при печати по σ последних 60 закрытий); бенчмарк 60/40 за тот же срок — следующий шаг (journal/predictions+outcomes, трек hunter_idea)."
  - "Действуемость: у пуша есть вход/триггер, стоп-условие с датой, срок сверки — чек-лист кодом."

# ── АУДИТ 07.11: ДОКАЗАТЕЛЬСТВА (проверяет КОД — ops/evidence_check.py; обязательны для охот с 08.11) ──
# Независимый аудит DHT/MP/FSLR: шлагбаум проверял форму (URL, проценты), а не содержание доводов.
# Каждое правило — детектор в тексте карточки + структурное поле, которое закрывает вопрос.
# Брак → идея не пишется в счёт и уходит владельцу «для обсуждения» с причиной; слабое, но честное
# обоснование → оговорка, которую КОД дописывает в пуш (абзац «Оговорки проверки»).
evidence:
  regulatory: "Регуляторный катализатор (указ, пошлина, правило, объявление ведомства, санкции, FDA) — поле regulatory: ссылка на САМ документ, дословная цитата, дата вступления, область действия, исключения (каждое — влияние на скорость эффекта и сверка со стоп-условиями) или цитата, что их нет, переходные условия, проверка поправок (дата, источники). Исключение, упомянутое в фактах, но не разобранное, — брак (FSLR: контракты до 06.08.2026). Абсолютный тезис («нельзя», «впервые») при исключениях — брак."
  absence: "Утверждение «документа/решения/поправки нет» — только с absence_checks: что искали, где (URL), когда, открыт ли первоисточник. «Не нашёл» не доказывает «нет»; без первоисточника код пишет оговорку (MP: сайт Минкоммерции КНР был закрыт сетью)."
  timing: "Отчёт как катализатор — catalyst.datetime_utc + session; сессию код сверяет со временем (mathlib/event_timing). Отчёт после закрытия двигает СЛЕДУЮЩУЮ сессию: ход дня до публикации — не реакция на неё (MP 05.11)."
  causality: "Ход цены, объяснённый событием, — price_moves с causality hypothesis|confirmed; confirmed — только с источником."
  metrics: "Прибыль на акцию, консенсус, выручка — facts[].metric: период, единицы, базис GAAP/non-GAAP/adjusted; консенсус — на том же базисе; выручка — с проверкой разовых статей (one_offs с повторяемостью: MP SEG+ $31.6 млн в $147.7 млн). Квартал на будущее — только с названным допущением."
  target: "Цель — target_basis: метод (dcf | nav | multiple | yield | event_analogy | external_target | price_level), формула над входами (код пересчитывает, расхождение >2% — брак), источник каждого входа, допущения; аналогия — ≥3 случая с ходом и сопоставимостью. Чужой таргет или исторический уровень — цель «предварительная» (код пишет это в пуш)."
  probability: "spec9.probability_kind: subjective (вероятность охотника всегда субъективна); calibrated — только со ссылкой на калибровку."
  eodhd_in_cloud: "С 09.11 EODHD доступен и в облаке: curl 'https://eodhd.com/api/<путь>?fmt=json&...' — ключ подставляет сеть окружения, в URL и тексты его НЕ писать. Консенсус: fundamentals/<TICKER>.US?filter=Earnings::Trend; капитализация и прибыль: filter=Highlights; цены: eod/<TICKER>.US."
  options_view: "Q-в-цене (09.11): python3 ops/options_view.py <ТИКЕР> <срок> --threshold <порог> — ожидаемое колебание до экспирации и риск-нейтральная вероятность дойти до порога по ценам опционов EODHD (с премией за риск). Вывод кода — целиком в карточку options_view; код покажет владельцу «рынок по опционам X% против нашей оценки Y%»."
  valuation_history: "Q-в-цене (09.11): python3 ops/multiples_view.py <ТИКЕР> — P/E и P/S сейчас против собственной истории за 5 лет (перцентиль, обычное значение). Низкий мультипликатор — не довод сам по себе; используй как мерило ожиданий рядом с market_view."
  attention: "Q-тренды (09.11): reports/attention/attention_latest.json (сервер, ежедневно) или python3 ops/attention_watch.py show <ТИКЕР> — растущее внимание толпы по просмотрам Википедии: ранний рост/разгон = повод искать, в т.ч. 2–3-й круг (кто выигрывает от того, о чём заговорили); пик = «толпа уже здесь», чаще поздно. В карточке — поле attention с выводом кода; это мерило, не довод."
  market_view: "VQ-2 (владелец 07.11) — главный вопрос инвестора: что рынок УЖЕ ждёт и почему мы ждём другого. market_view: вид (magnitude — больше/меньше рынка по показателю; timing — раньше/позже; flow — вынужденный продавец; rule — неверно понятое правило), ожидание рынка С ИСТОЧНИКОМ (консенсус EODHD Earnings::Trend: среднее, число аналитиков, пересмотр за 90 дней; или рост, зашитый в цену, — implied, код пересчитает обратным DCF), наше значение и почему иначе. Нет чисел/источника или разница меньше 5% — брак: идея уходит владельцу «для обсуждения». Рост акции ≠ отыграно; отсутствие роста ≠ недооценка."
  materiality: "VQ-2: эффект в деньгах относительно компании (доп. прибыль/выручка в год, срок, прибыль, выручка, капитализация). Код: «шум» — брак, «пограничный» и «не посчитано» — оговорка в пуше."
  durability: "VQ-2: что удержит эффект — сроки строительства мощностей, контракты, сертификация, дефицит ресурса — с источником. Нет — код пишет «идея предварительная»."
  chain: "VQ-2: звенья от повода до бумаги (≤3), у каждого качество: confirmed (с источником) или hypothesis. Больше одного неподтверждённого звена — брак: дальше гипотезы поверх гипотезы не идём (история: 452 пары, 0 подтверждено сверх случайности). Список вопросов о цепочке (кто получает спрос, где дефицит, кто поднимет цену) — подсказка для размышления, не шаблон."
  revisions: "Исходная карточка и прогноз неизменны (отпечаток sha256 в записи печати; ops/idea_revision.py verify). Исправление факта, новая гипотеза, новые условия сделки — отдельная версия reports/ideas/revisions/<stem>.rNN.json с датой и причиной; итоги считаются раздельно: прогноз, исполнимость входа, модельная сделка (mathlib/idea_outcome.py)."
