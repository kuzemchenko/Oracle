# knowledge/scenarios.yaml — ЗАГОТОВКИ СЦЕНАРИЕВ «если случится X — бумага Y» (Q-сторож-сценариев, владелец 15.11;
# ревью 14.11: Fable п.1–2, Codex «Г»). Читает ops/scenario_watch.py.
#
# Честность (П8, Инв#6):
#   • прошлые случаи — ТОЛЬКО по id эпизодов из knowledge/cascade_history.yaml (там дата, источник, звенья и ход
#     цены, посчитанный кодом по закрытиям); ход ставки = ход звена с той же ролью/тикером в этих эпизодах;
#     «почему выигрывает» код берёт из why_ru звена самого свежего эпизода, а не из этого файла;
#   • триггеры — правила для кода: всплеск статей NewsAPI.ai (по дням) против обычного уровня и/или ход цены
#     бумаги-датчика по снимку/текущим ценам; ни один триггер не означает «идея верна» — только «пора смотреть»;
#   • утверждён: false — черновик: сторож считает и пишет в журнал, но владельцу сообщение уходит только по
#     утверждённым (владелец утверждает каждую заготовку словом; правило 01.11).
версия: 1
создано: 2026-11-15
горизонт_дней: 20          # торговых дней — ход эпизодов считается на этом горизонте (5/20/60 доступны)
пауза_дней: 14             # сработавшая заготовка молчит 14 дней (одно событие — одно сообщение)
# Калибровка порогов новостей 15.11: архива у NewsAPI.ai на тарифе нет (видно ~30 дней), поэтому пороги — выше
# обычного дневного максимума за 16.10–15.11 по тем же словам (медиана/максимум: Ормуз+танкер 202/795 — пик 13.11,
# Красное море 184/433, Китай+редкие земли 89/162, дата-центр+атом 81/126, расходы на оборону 96/172,
# санкции+нефть+танкеры 96/349, bank run 10/192). Всплеск = статей за сегодня или вчера ≥ мин_статей И ≥
# всплеск_кратно × медианы 7 дней до них.

заготовки:
  - id: hormuz_threat
    название: "угроза судоходству у Ормуза (атаки на суда, без закрытия пролива)"
    что_случилось: "в Персидском или Оманском заливе нападают на танкеры или грозят перекрыть пролив, но нефть через него идёт"
    механизм: chokepoint_disruption
    эпизоды: [2019_gulf_of_oman_tankers, 2011_iran_hormuz_threat_eu_embargo, 2019_abqaiq_attack]
    триггер:
      новости: {слова: ["Strait of Hormuz", "tanker"], всплеск_кратно: 2.0, мин_статей: 400}
      цена: {бумага: BNO.US, дней: 3, ход_проц: 5}
      правило: любой
    ставки:
      - {бумага: BNO.US, имя: "United States Brent Oil Fund", роль: "фонд, повторяющий цену нефти Brent — прямой выигравший", роли: [crude_oil_brent, crude_oil], направление: up}
      - {бумага: DHT.US, имя: "DHT Holdings", роль: "владелец супертанкеров для нефти", роли: [crude_tanker_owner], направление: up}
      - {бумага: STNG.US, имя: "Scorpio Tankers", роль: "владелец танкеров для нефтепродуктов (дизель, бензин)", роли: [product_tanker_owner], направление: up}
    что_опровергнет:
      - "пролив закрывают по-настоящему — это другая заготовка («реальное выпадение нефти»): танкерщики тогда падают, суда заперты"
      - "через неделю атаки прекращаются, а нефть возвращается к уровню до повода"

  - id: hormuz_closure
    название: "реальное выпадение нефти с рынка (закрытие пролива, война у крупного экспортёра)"
    что_случилось: "нефть или газ физически перестают поступать на рынок от крупного экспортёра — не угрозы, а остановленные поставки"
    механизм: energy_supply_shock
    эпизоды: [2026_iran_war_hormuz_closure, 2022_russia_invasion_flows, 2011_libya_civil_war]
    триггер:
      новости: {слова: ["Strait of Hormuz", "closed"], всплеск_кратно: 2.0, мин_статей: 350}
      цена: {бумага: BNO.US, дней: 5, ход_проц: 10}
      правило: оба
    ставки:
      - {бумага: BNO.US, имя: "United States Brent Oil Fund", роль: "фонд, повторяющий цену нефти Brent", роли: [crude_oil_brent, crude_oil], направление: up}
      - {бумага: CF.US, имя: "CF Industries", роль: "производитель азотных удобрений на дешёвом газе США", роли: [nitrogen_fertilizer_producer], направление: up}
      - {бумага: LNG.US, имя: "Cheniere Energy", роль: "экспортёр сжиженного газа из США", роли: [lng_exporter], направление: up}
    что_опровергнет:
      - "поставки восстанавливаются за 1–2 недели (так было после удара по Абкайку в 2019 году)"
      - "страны выпускают нефть из резервов в объёме, сравнимом с выпавшим"

  - id: red_sea_shipping
    название: "атаки на суда в Красном море — судоходство идёт вокруг Африки"
    что_случилось: "суда массово отказываются от пути через Суэц и Красное море, маршруты удлиняются на 1–2 недели"
    механизм: chokepoint_disruption
    эпизоды: [2023_red_sea_houthi, 2023_hamas_attack_red_sea]
    триггер:
      новости: {слова: ["Red Sea", "Houthi"], всплеск_кратно: 2.0, мин_статей: 350}
      цена: {бумага: ZIM.US, дней: 5, ход_проц: 10}
      правило: любой
    ставки:
      - {бумага: ZIM.US, имя: "ZIM Integrated Shipping", роль: "контейнерная линия, продаёт перевозки по текущим ценам", роли: [container_liner, container_liner_spot], направление: up}
      - {бумага: DAC.US, имя: "Danaos", роль: "сдаёт контейнеровозы в аренду линиям", роли: [containership_lessor], направление: up}
      - {бумага: STNG.US, имя: "Scorpio Tankers", роль: "владелец танкеров для нефтепродуктов", роли: [product_tanker_owner], направление: up}
    что_опровергнет:
      - "крупные линии возвращаются на путь через Суэц"
      - "ставки фрахта не растут: судов в мире в избытке"

  - id: china_critical_materials
    название: "Китай ограничивает экспорт редких земель или других критических материалов"
    что_случилось: "Китай вводит лицензии, квоты или запрет на вывоз материалов, где он главный поставщик"
    механизм: critical_materials_export_control
    эпизоды: [2010_china_ree_japan, 2025_china_rare_earth_licences, 2025_china_ree_extraterritorial]
    триггер:
      новости: {слова: ["China", "rare earth"], всплеск_кратно: 2.0, мин_статей: 180}
      цена: {бумага: MP.US, дней: 3, ход_проц: 10}
      правило: любой
    ставки:
      - {бумага: MP.US, имя: "MP Materials", роль: "единственный в США добытчик редких земель и производитель магнитов", роли: [non_china_ree_producer, non_china_rare_earth_producer], направление: up}
      - {бумага: REMX.US, имя: "VanEck Rare Earth and Strategic Metals ETF", роль: "фонд акций добытчиков редких и стратегических металлов", роли: [ex_china_rare_earth_separator], направление: up}
    что_опровергнет:
      - "Китай откладывает или смягчает ограничения (так было в октябре 2025 года — бумаги тогда упали)"
      - "рост уже случился на слухах до официального объявления"

  - id: ai_power_deal
    название: "крупная ИТ-компания покупает электричество у атомной или другой станции под дата-центры"
    что_случилось: "Amazon, Microsoft, Google и т. п. подписывают долгий договор на электричество станции или покупают её мощность"
    механизм: datacenter_power_demand
    эпизоды: [2024_talen_aws_campus, 2024_tmi_microsoft, pjm_capacity_auction_2024, 2023_ai_capex_power_transformers]
    триггер:
      новости: {слова: ["data center", "nuclear"], всплеск_кратно: 2.0, мин_статей: 200}
      цена: {бумага: VST.US, дней: 3, ход_проц: 8}
      правило: любой
    ставки:
      - {бумага: VST.US, имя: "Vistra", роль: "владелец атомных и газовых станций, продаёт электричество по рыночной цене", роли: [merchant_nuclear_generator, merchant_power_generator], направление: up}
      - {бумага: CEG.US, имя: "Constellation Energy", роль: "крупнейший в США оператор атомных станций", роли: [nuclear_fleet_operator, merchant_nuclear_capacity_seller], направление: up}
      - {бумага: TLN.US, имя: "Talen Energy", роль: "владелец атомной станции, продающий мощность дата-центрам", роли: [nuclear_ipp_with_colocation, merchant_generator_concentrated], направление: up}
    что_опровергнет:
      - "регулятор запрещает или урезает такие сделки"
      - "новость о более дешёвом ИИ (как DeepSeek в январе 2025 года) — спрос на электричество пересматривают вниз"

  - id: rearmament
    название: "резкий рост военных бюджетов (война, решение о перевооружении)"
    что_случилось: "крупная страна или союз объявляет многолетний рост расходов на оборону"
    механизм: rearmament_cycle
    эпизоды: [2022_zeitenwende, 2023_oct7_israel, 2025_europe_rearm]
    триггер:
      новости: {слова: ["defense spending"], всплеск_кратно: 2.0, мин_статей: 250}
      цена: {бумага: EUAD.US, дней: 3, ход_проц: 6}
      правило: любой
    ставки:
      - {бумага: EUAD.US, имя: "Select STOXX Europe Aerospace & Defense ETF", роль: "фонд акций европейской оборонки", роли: [european_defense_prime, european_defense_basket], направление: up}
      - {бумага: LMT.US, имя: "Lockheed Martin", роль: "крупнейший оборонный подрядчик США", роли: [us_defense_prime], направление: up}
    что_опровергнет:
      - "объявленные деньги переносят на годы вперёд или не утверждают"
      - "переговоры о мире снимают срочность"

  - id: tanker_fleet_sanctions
    название: "санкции против нефтеэкспортёра или его танкеров — нефти нужно плыть дальше"
    что_случилось: "США или ЕС вводят санкции против крупного экспортёра нефти или против его флота, покупатели ищут нефть дальше"
    механизм: sanctions_flow_rerouting
    эпизоды: [2019_cosco_tanker_sanctions, 2022_russia_tanker_rerouting, 2018_iran_jcpoa_exit, 2025_rosneft_lukoil_sanctions]
    триггер:
      новости: {слова: ["sanctions", "oil", "tankers"], всплеск_кратно: 2.0, мин_статей: 400}
      цена: {бумага: DHT.US, дней: 3, ход_проц: 7}
      правило: любой
    ставки:
      - {бумага: DHT.US, имя: "DHT Holdings", роль: "владелец супертанкеров для нефти", роли: [crude_tanker_owner], направление: up}
      - {бумага: STNG.US, имя: "Scorpio Tankers", роль: "владелец танкеров для нефтепродуктов", роли: [product_tanker_owner], направление: up}
      - {бумага: PBF.US, имя: "PBF Energy", роль: "нефтепереработчик в США, вне зоны санкций", роли: [refiner_outside_zone], направление: up}
    что_опровергнет:
      - "санкции не исполняются — нефть идёт «теневым» флотом как раньше"
      - "одновременно падает спрос на нефть (рецессия)"

  - id: banking_stress
    название: "банковский стресс — бегство в надёжное"
    что_случилось: "крупный банк замораживает выплаты или рушится, вкладчики массово забирают деньги"
    механизм: banking_stress_flight_to_quality
    эпизоды: [2007_bnp_freeze, 2008_lehman, 2023_svb_regional_banks]
    триггер:
      новости: {слова: ["bank run"], всплеск_кратно: 3.0, мин_статей: 250}
      цена: {бумага: KRE.US, дней: 3, ход_проц: -8}
      правило: любой
    ставки:
      - {бумага: GLD.US, имя: "SPDR Gold Shares", роль: "фонд, повторяющий цену золота", роли: [gold], направление: up}
      - {бумага: TLT.US, имя: "iShares 20+ Year Treasury Bond ETF", роль: "фонд долгих облигаций правительства США", роли: [long_treasury], направление: up}
    что_опровергнет:
      - "регулятор за выходные гарантирует вклады и стресс гаснет"
      - "одновременно растёт инфляция — облигации тогда не спасают"
